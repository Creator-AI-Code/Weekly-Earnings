name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (preinstalled on the runner)
        working-directory: .
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; fi

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Build www from the web app
        run: npm run build:www

      - name: Add / sync Android platform
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Icons, permissions, version, signing
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/icons.py
          python3 scripts/patch-android.py

      - name: Gradle assembleDebug
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Momentum.apk"

      - name: Check the APK is signed with the Momentum key
        working-directory: .
        run: |
          AS=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -1)
          "$AS" verify --print-certs Momentum.apk | tee certs.txt
          grep -qi "e815be03b210a204ffe40da0d34ea00e78304eb694742ef513a7374cf39556b7" certs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Momentum-apk
          path: Momentum.apk

      - name: Move the latest tag to this commit
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: .
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest

      - name: Check versioned release
        id: ver
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(tr -d ' \n' < VERSION)"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          if gh release view "$V" > /dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

      - name: Versioned release (once per VERSION)
        if: ${{ steps.ver.outputs.new == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Momentum ${{ steps.ver.outputs.tag }}
          prerelease: false
          make_latest: false
          files: Momentum.apk
          body_path: RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          tag_name: latest
          name: Momentum (son sürüm)
          prerelease: false
          make_latest: true
          files: Momentum.apk
          body: |
            Android için Momentum. Telefonda bu sayfadan **Momentum.apk** dosyasını indirip aç (bilinmeyen kaynaklardan yüklemeye izin ver).
            Her `main` güncellemesinde otomatik yenilenir. Commit: ${{ github.sha }}
