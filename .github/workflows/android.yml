name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Build www from the web app
        run: npm run build:www

      - name: Add / sync Android platform
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Icons, permissions, version, signing
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/icons.py
          python3 scripts/patch-android.py

      - name: Gradle assembleDebug
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Momentum.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Momentum-apk
          path: Momentum.apk

      - name: Move the latest tag to this commit
        working-directory: .
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Momentum (son sürüm)
          prerelease: false
          make_latest: true
          files: Momentum.apk
          body: |
            Android için Momentum. Telefonda bu sayfadan **Momentum.apk** dosyasını indirip aç (bilinmeyen kaynaklardan yüklemeye izin ver).
            Her `main` güncellemesinde otomatik yenilenir. Commit: ${{ github.sha }}
