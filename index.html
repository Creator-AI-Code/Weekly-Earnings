  const j = await sbFetch('/auth/v1/signup', { method: 'POST', body: { email, password } }, false);
  if (j && j.access_token) { setSession(j); return true; }
  if (j && Array.isArray(j.identities) && !j.identities.length) { const e = new Error('User already registered'); e.code = 'user_already_exists'; e.status = 422; throw e; }
  return false;
}
function authErrorMsg(e) {
  const c = String(e.code || ''), m = String(e.message || '').toLowerCase();
  if (e.network) return T('Bağlantı kurulamadı. İnternetini kontrol et.');
  if (c === 'invalid_credentials' || /invalid login credentials/.test(m)) return T('E-posta ya da şifre yanlış.');
  if (c === 'user_already_exists' || c === 'email_exists' || /already registered/.test(m)) return T('Bu e-postayla zaten bir hesap var. "Giriş yap"ı kullan.');
  if (c === 'weak_password' || /password should/.test(m)) return T('Şifre çok zayıf. En az 8 karakter kullan; harf ve rakam karıştır.');
  if (c === 'email_not_confirmed' || /not confirmed/.test(m)) return T("E-posta adresin henüz onaylanmamış. Gelen e-postadaki bağlantıya tıkla ya da Supabase'te e-posta onayını kapat.");
  if (e.status === 429 || /rate limit/.test(m)) return T('Çok fazla deneme yapıldı. Birkaç dakika sonra tekrar dene.');
  if (c === 'signup_disabled') return T("Supabase'te yeni hesap açma kapalı.");
  return T('Giriş yapılamadı: {x}', { x: e.message });
}

// ---------- sync loop ----------
let syncing = false, syncAgain = false, syncTimer = null;

async function syncAll() {
  if (!SY.session) return;
  if (syncing) { syncAgain = true; return; }
  if (navigator.onLine === false) { setSyncState('offline'); return; }
  syncing = true; setSyncState('syncing');
  try {
    if (saveTimer) saveNow();
    const rows = await rest('GET', '/rest/v1/user_docs?select=doc,data,updated_at,device_id');
    const R = {}; (rows || []).forEach((r) => { R[r.doc] = r; });
    const me = SY.session.user.id; let applied = false;
    if (SY.syncedUser !== me) {
      const remoteHas = AREAS.some((a) => R[a] && hasContent(a, R[a].data)), localHas = AREAS.some((a) => hasContent(a, areaData(a)));
      if (remoteHas && localHas) {
        const choice = await askConflict(R);
        if (!choice) { setSyncState('wait', T('Hangi verilerin kullanılacağını seçmen gerekiyor.')); return; }
        if (choice === 'cloud') AREAS.forEach((a) => { if (R[a] && applyRemote(a, R[a])) applied = true; });
        else { const now = Date.now(); AREAS.forEach((a) => { SY.updatedAt[a] = now; }); }
      } else if (remoteHas) AREAS.forEach((a) => { if (R[a] && applyRemote(a, R[a])) applied = true; });
      SY.syncedUser = me; saveSync();
    }
    const ups = [];
    for (const a of AREAS) {
      const r = R[a], lt = SY.updatedAt[a] || 0, rt = r ? Date.parse(r.updated_at) || 0 : 0;
      if (r && rt > lt) { if (applyRemote(a, r)) applied = true; }
      else if (!r || lt > rt) { const ts = lt || Date.now(); SY.updatedAt[a] = ts; ups.push({ user_id: me, doc: a, data: areaData(a), updated_at: new Date(ts).toISOString(), device_id: SY.deviceId }); }
    }
    if (ups.length) await rest('POST', '/rest/v1/user_docs?on_conflict=user_id,doc', ups, { Prefer: 'resolution=merge-duplicates,return=minimal' });
    await rest('POST', '/rest/v1/devices?on_conflict=id,user_id', [{ id: SY.deviceId, user_id: me, name: SY.deviceName, platform: platformName(), last_seen: new Date().toISOString() }], { Prefer: 'resolution=merge-duplicates,return=minimal' });
    SY.lastSync = Date.now(); saveSync(); setSyncState('ok');
    if (applied) renderAll();
    startRealtime();
  } catch (e) {
    if (e.network) setSyncState('offline');
    else if (e.status === 401 || e.status === 400 && /refresh/i.test(e.message)) { localSignOut(); setSyncState('off'); toast(T('Oturum süresi doldu, yeniden giriş yap.')); }
    else setSyncState('error', T('Senkron hatası: {x}', { x: e.message }));

}
let conflictResolve = null;
function askConflict(R) {
  const rts = AREAS.map((a) => (R[a] ? Date.parse(R[a].updated_at) || 0 : 0)), lts = AREAS.map((a) => SY.updatedAt[a] || 0);
  const remote = Math.max(...rts), local = Math.max(...lts);

}

let rtClient = null, rtChan = null, rtFailed = false;
async function loadSupabaseLib() {
  if (window.supabase && window.supabase.createClient) return window.supabase;

}
async function startRealtime() {

    const lib = await loadSupabaseLib();
    rtClient = rtClient || lib.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
    rtClient.realtime.setAuth(SY.session.access_token);
    rtChan = rtClient.channel('docs-' + SY.deviceId).on('postgres_changes', { event: '*', schema: 'public', table: 'user_docs', filter: 'user_id=eq.' + SY.session.user.id }, (p) => {

// ===================== VERGİ (Uber GST + income tax set-aside, per BAS quarter) =====================
// Quarter keys follow quarterOf(): '<FY end year>-Q<n>', e.g. Oct 2026 → '2027-Q2' (Q2 2026–27).
const UEXP_CATS = [
  ['fuel', 'Yakıt', 'car'], ['service', 'Servis ve bakım', 'car'], ['tyres', 'Lastik', 'car'], ['wash', 'Yıkama ve temizlik', 'car'],
  ['phone', 'Telefon ve internet', 'phone'], ['parking', 'Otopark ve geçiş ücreti', 'car'], ['insurance', 'Sigorta', 'car'], ['rego', 'Rego, CTP ve BHSL', 'car'],
  ['amenities', 'Yolcu ikramı (su, şeker)', 'other'], ['fees', 'Muhasebe ve banka ücretleri', 'other'], ['other', 'Diğer', 'other']
];
const UEXP_ICON = { fuel: 'car', service: 'car', tyres: 'car', wash: 'car', phone: 'phone', parking: 'car', insurance: 'receipt', rego: 'receipt', amenities: 'bag', fees: 'percent', other: 'list' };
const catName = (k) => { const c = UEXP_CATS.find((x) => x[0] === k); return T(c ? c[1] : 'Diğer'); };
const logbook = () => { const v = +S.logbookPct; return v > 0 && v <= 100 ? v : 100; };
// built-in defaults, overridable per category in Settings → Vergi (money.settings.catDefaults)
function catDefaults(cat) {
  const c = UEXP_CATS.find((x) => x[0] === cat) || UEXP_CATS[10], o = (S.catDefaults || {})[cat] || {};
  return { gst: o.gst != null ? !!o.gst : !['rego', 'fees'].includes(cat), biz: o.biz != null ? o.biz : c[2] === 'car' ? logbook() : c[2] === 'phone' ? 50 : 100 };
}
function setCatDefault(cat, patch) { const all = S.catDefaults = Object.assign({}, S.catDefaults); all[cat] = Object.assign({}, all[cat], patch); }
function qParts(key) { const [fy, q] = key.split('-Q').map(Number); return { fy, q }; }
function qInfo(key) {
  const { fy, q } = qParts(key), sm = [6, 9, 0, 3][q - 1], y = q <= 2 ? fy - 1 : fy;
  const start = new Date(y, sm, 1), end = new Date(y, sm + 3, 0);
  const due = q === 1 ? new Date(y, 9, 28) : q === 2 ? new Date(y + 1, 1, 28) : q === 3 ? new Date(y, 3, 28) : new Date(y, 6, 28);
  return { fy, q, startId: idOf(start), endId: idOf(end), due, range: `${MONTHS[sm]}–${MONTHS[(sm + 2) % 12]} ${y}` };
}
const fyName = (fy) => `${fy - 1}–${String(fy).slice(2)}`;
const qName = (key) => { const { fy, q } = qParts(key); return `Q${q} ${fyName(fy)}`; };

function taxQuarter(key) {
  const qi = qInfo(key), a = qi.startId, b = qi.endId;
  const weeks = Object.keys(D.money.weeks).filter((id) => id >= a && id <= b && (+D.money.weeks[id].uberEarn || 0) > 0);
  const E = weeks.reduce((s, id) => s + (+D.money.weeks[id].uberEarn || 0), 0);
  const ex = D.money.uberExpenses.filter((e) => e.d >= a && e.d <= b);
  let credit = 0, exEx = 0, exTotal = 0;
  ex.forEach((e) => { const amt = +e.amount || 0, biz = (e.biz == null ? 100 : +e.biz) / 100, g = e.gst ? amt / 11 : 0; credit += g * biz; exEx += (amt - g) * biz; exTotal += amt; });
  const sm = D.money.taxSummaries[key] || {}, exact = +sm.grossFares > 0;
  const gross = exact ? +sm.grossFares : E, fees = exact ? +sm.uberFees || 0 : 0;
  const g1A = gross / 11, g1B = credit + fees / 11;
  const profit = (gross - gross / 11) - (fees - fees / 11) - exEx;
  return { key, qi, E, nWeeks: weeks.length, ex, exTotal, exact, gross, fees, g1A, g1B, credit, gst: g1A - g1B, exEx, profit };
}
// income tax share: average weekly Uber profit over the weeks driven so far this FY (Q1..this quarter) x weeks per year
// = estimated annual Uber profit, taxed on top of salary. Income tax + Medicare and the MLS are split so the MLS,
// which applies to the whole income once over the threshold, is spread over the whole year's Uber profit.
function taxShare(key) {
  const { fy, q } = qParts(key); let P = 0, n = 0;

// ===================== render =====================
function applyTheme() {
  const t = D.ui.theme, html = document.documentElement;
  if (t === 'light' || t === 'dark') html.setAttribute('data-theme', t); else html.removeAttribute('data-theme');
  const dark = t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', dark ? '#14110f' : '#f6f3ee');
}
function applyLang() {
  setLocale(D.ui.lang);
  document.title = 'Momentum';
  $('fab').setAttribute('aria-label', T('Hızlı kayıt'));
  $('gearBtn').setAttribute('aria-label', T('Ayarlar ve yedek'));
  $('tabs').setAttribute('aria-label', T('Bölümler'));
  document.querySelectorAll('#tabs button').forEach((b) => { b.querySelector('.tl').textContent = T(TITLE[b.dataset.tab] === 'Momentum' ? 'Bugün' : TITLE[b.dataset.tab]); });
}
function keepFocus(fn) {
  const ae = document.activeElement, id = ae && ae.id, caret = id && ae.selectionStart;
  fn();
  if (id && ae.tagName !== 'BUTTON' && ae.type !== 'file') { const el = $(id); if (el && el !== ae) { el.focus({ preventScroll: true }); try { if (caret != null) el.setSelectionRange(caret, caret); } catch (e) {} } }
}
function render() {
  keepFocus(() => {
    const v = $('view');
    v.className = AREA[U.tab];
    v.innerHTML = ({ bugun: vBugun, para: vPara, gelisim: vGelisim, saglik: vSaglik, yatirim: vYatirim })[U.tab]();
    $('topTitle').textContent = U.tab === 'bugun' ? 'Momentum' : T(TITLE[U.tab]);
    document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === U.tab)));
    $('fab').hidden = U.tab !== 'bugun';
    const sg = $('secGear'); if (sg) { sg.dataset.sec = TAB_SEC[U.tab]; sg.setAttribute('aria-label', T('Bu sekmenin ayarları')); sg.title = T('Bu sekmenin ayarları'); }
    if (U.tab === 'para' && U.paraSeg === 'hafta') paraCalc();
    paintSyncChip();
  });
}
function renderSheet() { keepFocus(() => { $('sheetRoot').innerHTML = vSheet(); }); }
function renderPage() { keepFocus(() => { $('pageRoot').innerHTML = U.page === 'settings' ? vSettings() : U.page === 'insights' ? vInsights() : ''; }); }
function renderAll() { render(); renderSheet(); renderPage(); }
function go(tab, seg) {
  U.tab = tab; U.armed = null;
  if (seg && tab === 'para') U.paraSeg = seg; if (seg && tab === 'gelisim') U.gelSeg = seg;
  if (seg === 'vergi') U.taxQ = quarterOf(thisWeekId()).key;
  try { localStorage.setItem(TAB_KEY, tab); } catch (e) {}
  render(); window.scrollTo({ top: 0 });
  if (tab === 'yatirim') refreshPrices(false);
}
let ovDepth = 0;
function openOverlay(kind, v) {
  if (kind === 'page') { U.page = v; U.bk = null; if (v === 'settings') U.setSec = null; renderPage(); } else if (kind === 'setSec') { U.setSec = v; U.bk = null; if (v === 'hesap' && SY.session) loadDevices(); renderPage(); const pg = $('page'); if (pg) pg.scrollTop = 0; } else { U.sheet = v; renderSheet(); }
  try { history.pushState({ ov: ++ovDepth }, ''); } catch (e) {}
}

// ---------- swipe left to delete (pointer events, ~80px threshold) ----------
let swipe = null, swipeSuppress = false;
document.addEventListener('pointerdown', (e) => {
  const fg = e.target.closest('.swipe-fg'); if (!fg || e.button > 0) return;
  swipe = { fg, row: fg.parentElement, x: e.clientX, y: e.clientY, dx: 0, on: false, pid: e.pointerId };
});
document.addEventListener('pointermove', (e) => {
  if (!swipe || e.pointerId !== swipe.pid) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (!swipe.on) { if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { swipe.on = true; try { swipe.fg.setPointerCapture(e.pointerId); } catch (err) {} swipe.row.classList.add('swiping'); } else return; }
  swipe.dx = Math.max(-160, Math.min(0, dx));
  swipe.fg.style.transform = `translateX(${swipe.dx}px)`;
  swipe.row.classList.toggle('armed', swipe.dx <= -80);
});
function endSwipe(e) {
  if (!swipe || (e && e.pointerId !== swipe.pid)) return;
  const s = swipe; swipe = null; if (!s.on) return;
  swipeSuppress = true; setTimeout(() => { swipeSuppress = false; }, 350);
  s.row.classList.remove('swiping');
  // full swipe deletes; a partial swipe leaves the red "Sil" button revealed to tap
  if (s.dx <= -120) { s.fg.style.transform = 'translateX(-110%)'; const id = s.row.dataset.swipe; setTimeout(() => deleteDaily(id), 140); }
  else if (s.dx <= -40) { s.fg.style.transform = 'translateX(-96px)'; s.row.classList.add('open'); }
  else { s.fg.style.transform = ''; s.row.classList.remove('armed', 'open'); }
}
document.addEventListener('pointerup', endSwipe);
