// returns an error string or null; saves on success
function submitShift(mode) {
  const raw = val('odoKm').replace(/\D/g, ''), km = raw ? parseInt(raw, 10) : null, ts = fromDtLocal(val('odoAt'));
  if (km == null || !(km >= 0) || km > 3e6) return T('Göstergedeki km\'yi yaz.');
  if (!ts) return T('Tarih ve saati seç.');
  if (ts > Date.now() + 5 * 6e4) return T('Gelecekte bir saat seçilemez.');
  const o = openShift();
  if (mode === 'end') {
    if (!o) return T('Açık vardiya yok.');
    if (ts <= o.start) return T('Bitiş saati başlangıçtan ({t}) sonra olmalı.', { t: hhmm(o.start) });
    if (km < o.kmStart) return T('Bitiş km\'si başlangıçtan ({k}) küçük olamaz.', { k: fmtKm(o.kmStart) });
    if (km - o.kmStart > 1500) return T('Tek vardiyada {k} km çok fazla; rakamı kontrol et.', { k: fmtKm(km - o.kmStart) });
    o.end = ts; o.kmEnd = km; save();
    return { msg: T('Vardiya kaydedildi: {k} km · {d}', { k: fmtKm(km - o.kmStart), d: durTxt(ts - o.start) }) };
  }
  const fl = odoFloor(ts); if (fl != null && km < fl) return T('Gösterge daha önceki okumadan ({k} km) küçük olamaz.', { k: fmtKm(fl) });
  if (mode === 'start') {
    if (o) return T('Zaten açık bir vardiya var.');
    TRIPS().push({ id: uid(), start: ts, end: null, kmStart: km, kmEnd: null }); save();
    return { msg: T('İyi vardiyalar! Başlangıç {k} km', { k: fmtKm(km) }) };
  }
  if (mode === 'odo') { D.money.odo.push({ id: uid(), ts, km }); save(); return { msg: T('Gösterge kaydedildi: {k} km', { k: fmtKm(km) }) }; }
  if (mode === 'lbStart') { D.money.lb = { startTs: ts, odoStart: km, vehicle: val('lbVeh').trim() }; save(); return { msg: T('Logbook başladı. 12 hafta sonra hatırlatacağım.') }; }
  if (mode === 'lbEnd') {
    const lb = D.money.lb; if (!lb) return T('Logbook yok.'); if (ts <= lb.startTs) return T('Bitiş, başlangıçtan sonra olmalı.');
    lb.endTs = ts; lb.odoEnd = km; const st = lbStats(); lb.pct = st.pct == null ? null : Math.floor(st.pct);
    if (lb.pct != null) S.logbookPct = Math.max(1, lb.pct); save();
    return { msg: lb.pct != null ? T('Logbook tamamlandı: Uber payın {p}. Vergi ayarına uygulandı.', { p: pct(lb.pct) }) : T('Logbook tamamlandı.') };
  }
  return null;
}

// ===================== PLAN (weekly savings target, pots with due dates, Uber shift plan, "what can I do today", ask Claude) =====================
// settings.saveTarget: $ to keep each week; settings.uberPlan: [{ wd 0–6 (Sun=0), part 'sabah'|'aksam'|'gun', h }]
const PARTS = [['sabah', 'Sabah', 12], ['aksam', 'Akşam', 23], ['gun', 'Tüm gün', 21]];
const WD_ORDER = [1, 2, 3, 4, 5, 6, 0];
const planOn = () => (+S.saveTarget || 0) > 0;
// average net Uber $/h (after GST, fuel, car reserve, tax) over the last 6 weeks with hours; fallback 22
function uberRate() {
  let n = 0, h = 0;
  Object.keys(D.money.weeks).sort().reverse().slice(0, 8).forEach((id) => { const c = calc(D.money.weeks[id]); if (c.E > 0 && c.H > 0) { n += c.uberNet + c.fx; h += c.H; } });
  return h >= 5 ? Math.max(5, n / h) : 22;
}
// pots with a due date: what to put in this week so they are full in time
function potNeeds(now) {
  now = now || new Date(); const tk = keyOf(now);
  return D.money.pots.filter((p) => !p.done && p.due && p.target > p.saved).map((p) => {
    const days = Math.max(0, daysTo(p.due)), weeks = Math.max(1, Math.ceil((days + 1) / 7)), need = p.target - p.saved;
    const thisWeek = (p.log || []).filter((l) => l.a > 0 && l.d >= idOf(mondayOf(now)) && l.d <= tk).reduce((s, l) => s + l.a, 0);
    return { p, need, weeks, perWeek: need / weeks, days, left: Math.max(0, need / weeks - 0) , added: thisWeek };
  });
}
function plannedLeft(now) {
  now = now || new Date(); const wd = now.getDay(), hr = now.getHours(), out = [];
  const order = (d) => (d + 6) % 7; // Mon=0 … Sun=6
  (S.uberPlan || []).forEach((s) => {
    const part = PARTS.find((x) => x[0] === s.part) || PARTS[2];
    if (order(s.wd) > order(wd) || (s.wd === wd && hr < part[2] - 1)) out.push(s);
  });
  return out.sort((a, b) => order(a.wd) - order(b.wd));
}
function weekPlan(now) {
  now = now || new Date(); const s = safeToSpend(now), c = s.c, rate = uberRate();
  const left = plannedLeft(now), planH = left.reduce((a, x) => a + (+x.h || 0), 0), planNet = planH * rate;
  const pots = potNeeds(now), potsWeek = pots.reduce((a, x) => a + Math.max(0, x.perWeek - x.added), 0);
  // pots are paid from money you already have when your accounts cover them; only the uncovered part comes out of this week
  let cover = 0;
  if (D.money.accounts.length) { const tot = D.money.accounts.reduce((a, x) => a + (+x.bal || 0), 0), o = moneyOwed(); cover = Math.max(0, tot - o.gst - o.tax - D.money.pots.filter((q) => !q.done).reduce((a, q) => a + (+q.saved || 0), 0)); }
  const potsFromWeek = Math.max(0, potsWeek - cover);
  const started = !S.saveFrom || s.id >= idOf(mondayOf(parseKey(S.saveFrom)));
  const target = started ? +S.saveTarget || 0 : 0, projected = c.left + planNet;
  const room = projected - target - potsFromWeek, perDay = room / s.daysLeft;
  const short = room < 0 ? -room : 0, extraH = short > 0 ? Math.ceil(short / rate) : 0;
  return { s, c, rate, left, planH, planNet, pots, potsWeek, potsFromWeek, covered: potsWeek - potsFromWeek, target, started, projected, room, perDay, short, extraH };
}
function todayAdvice(P) {
  if (P.room < 0) return { cls: 'red', ic: 'x', t: T('Bugün harcama yok'), sub: P.extraH <= 15 ? T('Hedefe {x} eksik: planın dışında ~{h} saat Uber gerekiyor.', { x: usd(P.short), h: P.extraH }) : T('Bu hafta hedefe {x} eksik; plana göre {y} birikir. Harcamayı en aza indir.', { x: usd(P.short), y: usd(Math.max(0, P.projected - P.potsFromWeek)) }) };
  if (P.perDay >= 25) return { cls: 'green', ic: 'check', t: T('Kahve de dışarıda yemek de olur'), sub: T('Günde {x} harcama alanın var, hedef ve kumbaralar ayrıldıktan sonra.', { x: usd(P.perDay) }) };
  if (P.perDay >= 7) return { cls: 'amber', ic: 'spark', t: T('Kahve olur, yemeği evde ye'), sub: T('Günde {x} harcama alanın var.', { x: usd(P.perDay) }) };
  return { cls: 'red', ic: 'x', t: T('Bugün harcama yok'), sub: T('Günde sadece {x} alanın var; hedefi korumak için bugün harcama yapma.', { x: usd(Math.max(0, P.perDay)) }) };
}
const dayShort = (wd) => DAYS[wd];
function planCard() {
  if (!planOn()) return `<section class="sec a-para plan" id="planSetup">${secHead(T('Haftalık birikim hedefi'))}

// ===================== FİŞ TARA (receipt scan → OCR → expense + photo in Supabase Storage) =====================
// Android app: ML Kit document scanner + on-device text recognition. Web: camera/file photo, amounts typed by hand.
// Photos are compressed (~1600 px JPEG) and kept in IndexedDB first, then uploaded to the private 'receipts' bucket
// under <user id>/; an expense refers to its photo by `rc` (the storage path without the user folder).
const FUEL_BRANDS = /\b(shell|bp|ampol|caltex|7[- ]?eleven|united|puma|liberty|metro|mobil|costco fuel|coles express|reddy express|eg (?:fuel|group|ampol)|astron|vibe|speedway|freedom fuels?|on the run|otr)\b/i;
const FUEL_WORDS = /\b(unleaded|diesel|e10|u91|u95|u98|ulp|pulp|vortex|v-power|premium 9[58]|litres?|ltrs?|\/l\b|fuel)\b/i;
const AMT = /(?:\$\s?)?(\d{1,4}(?:[,.]\d{3})*[.,]\d{2})(?!\d)/g;
const toAmt = (s) => { const t = s.replace(/[$\s]/g, ''); const m = /^(\d{1,4}(?:[,.]\d{3})*)[.,](\d{2})$/.exec(t); return m ? +(m[1].replace(/[,.]/g, '') + '.' + m[2]) : null; };
const MON3 = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
function parseReceipt(text) {
  const lines = String(text || '').split(/\r?\n/).map((l) => l.trim()).filter(Boolean), all = lines.join('\n');
  const amtsIn = (l) => [...l.matchAll(AMT)].map((m) => toAmt(m[1])).filter((v) => v != null);
  // total: the amount on (or right after) a TOTAL / AMOUNT DUE / EFTPOS line; "subtotal" lines don't count
  let total = null;
  for (let i = 0; i < lines.length && total == null; i++) {
    const l = lines[i];
    if (/\b(grand\s+)?total\b|amount\s+(due|paid)|balance\s+due|\beftpos\b|\bpurchase\b|\bcredit\b|\bdebit\b|\bvisa\b|\bmastercard\b|\bpaid\b/i.test(l) && !/sub\s*-?\s*total|gst|tax\s+invoice|change|rounding|cash\s*out|tip/i.test(l)) {
      const a = amtsIn(l); if (a.length) total = a[a.length - 1]; else if (lines[i + 1]) { const b = amtsIn(lines[i + 1]); if (b.length) total = b[0]; }
    }
  }
  const every = lines.flatMap(amtsIn).filter((v) => v > 0 && v < 5000);
  if (total == null && every.length) total = Math.max(...every);
  // GST: "GST $6.18", "Includes GST 6.18", "GST included 6.18", "TOTAL INCLUDES GST OF $6.18"
  let gst = null;
  lines.forEach((l, i) => { if (gst == null && /\bgst\b/i.test(l) && !/abn|reg(istered|\.)?\s*for\s*gst|gst\s*(free|exempt)/i.test(l)) { const a = amtsIn(l); if (a.length) gst = a[a.length - 1]; else if (lines[i + 1]) { const b = amtsIn(lines[i + 1]); if (b.length) gst = b[0]; } } });
  if (gst != null && total != null && (gst <= 0 || gst > total / 10 + 0.05)) gst = null; // GST is 1/11 of a fully taxable total, never more
  // date: 21/10/2026, 21-10-26, 21.10.2026, 2026-10-21, 21 Oct 2026, 21OCT26
  let date = null; const now = new Date();
  const ok = (y, m, d) => { if (y < 100) y += 2000; const dt = new Date(y, m - 1, d); return dt.getMonth() === m - 1 && dt.getDate() === d && y >= 2020 && dt <= addDays(now, 2) ? idOf(dt) : null; };
  let m = /\b(20\d{2})[-/.](\d{1,2})[-/.](\d{1,2})\b/.exec(all); if (m) date = ok(+m[1], +m[2], +m[3]);
  if (!date) for (const x of all.matchAll(/\b(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})\b/g)) { date = ok(+x[3], +x[2], +x[1]); if (date) break; }
  if (!date) { m = /\b(\d{1,2})\s*-?\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s*-?\s*(\d{2,4})\b/i.exec(all); if (m) date = ok(+m[3], MON3[m[2].toLowerCase()], +m[1]); }
  // merchant: a known brand, else the first line that looks like a name
  const brand = FUEL_BRANDS.exec(all) || /\b(woolworths|coles|aldi|iga|bunnings|officeworks|kmart|target|big w|jb hi-?fi|mcdonald'?s|kfc|hungry jack'?s|subway|guzman|starbucks|gloria jean'?s|chemist warehouse|supercheap auto|repco|autobarn|ultra tune|mycar|bob jane|kmart tyre)\b/i.exec(all);
  const nameLine = lines.find((l) => /[a-z]{3,}/i.test(l) && !/tax\s+invoice|receipt|abn|phone|ph:|tel|www\.|@|\d{4,}/i.test(l) && l.length <= 40);
  const merchant = brand ? brand[0].replace(/\b\w/g, (c) => c.toUpperCase()) : nameLine ? nameLine.replace(/\s{2,}/g, ' ') : '';
  const isFuel = !!(FUEL_BRANDS.test(all) && FUEL_WORDS.test(all)) || /\b(unleaded|diesel|e10|u91|u95|u98|litres?)\b/i.test(all);
  const lm = /(\d{1,3}[.,]\d{1,3})\s*(?:l\b|ltrs?|litres?)/i.exec(all), litres = lm ? +lm[1].replace(',', '.') : null;
  return { total, gst, date, merchant, isFuel, litres, hasText: lines.length > 0 };
}

// ---------- local photo store (IndexedDB) ----------
let rcDbP = null;
function rcDb() {
  if (!rcDbP) rcDbP = new Promise((res, rej) => { try { const r = indexedDB.open('momentum-receipts', 1); r.onupgradeneeded = () => r.result.createObjectStore('img'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } });
  return rcDbP;
}
async function rcPut(path, rec) { const db = await rcDb(); return new Promise((res, rej) => { const t = db.transaction('img', 'readwrite'); t.objectStore('img').put(rec, path); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
async function rcGet(path) { const db = await rcDb(); return new Promise((res) => { const q = db.transaction('img').objectStore('img').get(path); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); }
async function rcPending() { const db = await rcDb(); return new Promise((res) => { const out = [], q = db.transaction('img').objectStore('img').openCursor(); q.onsuccess = () => { const c = q.result; if (!c) { res(out); return; } if (!c.value.up) out.push(c.key); c.continue(); }; q.onerror = () => res(out); }); }

// ---------- image → compressed JPEG ----------
async function compressImage(blob) {
  const bmp = await createImageBitmap(blob), k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height); if (bmp.close) bmp.close();
  return new Promise((res) => cv.toBlob((b) => res(b || blob), 'image/jpeg', 0.72));
}

// ---------- Supabase Storage ----------
const rcFull = (path) => SY.session.user.id + '/' + path;
async function rcUpload(path) {
  if (!SY.session) return false; const r = await rcGet(path); if (!r || r.up) return !!r;
  await ensureFresh();
  const res = await fetch(SB_URL + '/storage/v1/object/receipts/' + rcFull(path), { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SY.session.access_token, 'Content-Type': 'image/jpeg', 'x-upsert': 'true' }, body: r.blob });
  if (!res.ok) throw new Error('upload ' + res.status);
  r.up = true; await rcPut(path, r); return true;
}
let rcFlushing = false;
async function rcFlush() {
  if (rcFlushing || !SY.session || !navigator.onLine) return; rcFlushing = true;
  try { for (const p of await rcPending()) { try { await rcUpload(p); } catch (e) { break; } } } catch (e) {} finally { rcFlushing = false; }
}
const rcUrls = {};
async function rcUrl(path) {
  if (rcUrls[path]) return rcUrls[path];
  let r = null; try { r = await rcGet(path); } catch (e) {}
  if (!r && SY.session) {
    try { await ensureFresh(); const res = await fetch(SB_URL + '/storage/v1/object/authenticated/receipts/' + rcFull(path), { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SY.session.access_token } });
      if (res.ok) { r = { blob: await res.blob(), up: true }; rcPut(path, r).catch(() => {}); } } catch (e) {}
  }
  return r ? (rcUrls[path] = URL.createObjectURL(r.blob)) : null;
}
async function rcDelete(path) {
  try { const db = await rcDb(); db.transaction('img', 'readwrite').objectStore('img').delete(path); } catch (e) {}
  if (SY.session) try { await rest('DELETE', '/storage/v1/object/receipts/' + rcFull(path)); } catch (e) {}
}

// ---------- scan flow ----------
async function scanReceipt() {
  let blob = null, text = '';
  if (isNative() && capPlugin('DocumentScanner')) {
    try {
      const r = await capPlugin('DocumentScanner').scanDocument({ pageLimit: 1, resultFormats: 'JPEG', scannerMode: 'FULL', galleryImportAllowed: true });
      const uri = r && r.scannedImages && r.scannedImages[0]; if (!uri) return;
      try { const tr = await capPlugin('TextRecognition').processImage({ path: uri }); text = (tr && tr.text) || ''; } catch (e) { text = ''; }
      blob = await (await fetch(window.Capacitor.convertFileSrc ? window.Capacitor.convertFileSrc(uri) : uri)).blob();
    } catch (e) { if (/cancel/i.test(String(e && (e.message || e)))) return; toast(T('Tarayıcı açılamadı, fotoğraf seç.')); blob = null; }
  }
  if (!blob) { const f = await pickPhoto(); if (!f) return; blob = f; }
  let small = blob; try { small = await compressImage(blob); } catch (e) {}
  const p = parseReceipt(text), path = todayKey() + '-' + uid() + '.jpg';
  await rcPut(path, { blob: small, up: false });
  rcUrls[path] = URL.createObjectURL(small);
  openOverlay('sheet', { kind: 'receipt', path, ocr: !!text, p, amt: p.total != null ? inNum(p.total.toFixed(2)) : '', gst: p.gst != null ? inNum(p.gst.toFixed(2)) : '', d: p.date || todayKey(), name: p.merchant || '', who: p.isFuel ? 'uber' : 'kisisel', ucat: p.isFuel ? 'fuel' : 'service', dcat: p.isFuel ? FUEL_CAT : null });
}

    i.onchange = () => { const f = i.files && i.files[0]; i.remove(); res(f || null); };
    document.body.appendChild(i); i.click();
    setTimeout(() => { if (document.body.contains(i)) { /* still waiting for the picker */ } }, 0);

}

// The PDF's text is read on the device with pdf.js (no upload). money.uberSums[<start date>] keeps one parsed period;
// the quarter's taxSummaries entry is rebuilt from the periods that start inside it.
// GST treatment (Simpler BAS): G1 = transportation + delivery + incentives/misc (tips left out: not a sale),

  let a = null, b = null; const all = lines.join('\n');

  if (!a) { m = /\b(\d{1,2})\s+([A-Za-z]{3,9})\s+(20\d{2})\s*[-–]\s*(\d{1,2})\s+([A-Za-z]{3,9})\s+(20\d{2})\b/.exec(all); if (m && monIdx(m[2]) >= 0 && monIdx(m[5]) >= 0) { a = new Date(+m[3], monIdx(m[2]), +m[1]); b = new Date(+m[6], monIdx(m[5]), +m[4]); } }

    if (/^total transportation income/.test(L) && v != null) r.transport = v;
    else if (/^total delivery income/.test(L) && v != null) r.delivery = v;
    else if (/^total other income/.test(L) && v != null) r.other = v;
    else if (/^total potential tax deductions/.test(L) && v != null) r.deductions = v;
    else if (/^gross transportation fare/.test(L) && v != null) r.fare = v;
    else if (/^split fare/.test(L) && v != null) r.split = v;
    else if (/^safe rides fee/.test(L) && v != null) r.safe = v;
    else if (/^tolls reimbursement/.test(L) && v != null) { if (sec === 'd') r.tollsD = v; else r.tollsT = v; }
    else if (/^miscellaneous/.test(L) && v != null) { if (sec === 'o') r.miscO = v; else r.miscT = v; }

    else if (/^airport fee/.test(L) && v != null) r.airport = v;
    else if (/^booking fee/.test(L) && v != null) r.booking = v;
    else if (/^delivery fee/.test(L) && v != null) r.deliveryFee = v;
    else if (/^delivery incentives/.test(L) && v != null) r.deliveryInc = v;

// pdf.js text items → lines (items on the same baseline joined left to right)
async function pdfText(file) {
  const lib = await loadScript(PDFJS + 'pdf.min.js', 'pdfjsLib');

  const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise, out = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const tc = await (await doc.getPage(i)).getTextContent(), rows = [];
    tc.items.forEach((it) => { if (!it.str || !it.str.trim()) return; const y = it.transform[5], x = it.transform[4]; let r = rows.find((q) => Math.abs(q.y - y) < 3); if (!r) rows.push(r = { y, items: [] }); r.items.push({ x, s: it.str }); });
    rows.sort((p, q) => q.y - p.y).forEach((r) => out.push(r.items.sort((p, q) => p.x - q.x).map((x) => x.s).join('  ')));
  }

}

  const has = (y, m) => Object.values(D.money.uberSums).some((x) => { const d = parseKey(x.start); return d.getFullYear() === y && d.getMonth() === m; });
  return `<div class="card" id="ubCard">${head('receipt', T('Uber vergi özetleri'), `<button type="button" class="btn sm" data-act="ubImport" id="ubImport">${ico('upload')}${T('PDF yükle')}</button>`)}
    <div class="ub-months">${ms.map(({ y, m }) => `<span class="chip ${has(y, m) ? 'gain' : ''}">${has(y, m) ? ico('check') : ''}${MONTHS_FULL[m]}</span>`).join('')}</div>
    ${uberSumList(key) || `<p class="note">${T('Uber Driver uygulaması → Hesap → Vergi bilgileri’nden (ya da drivers.uber.com) aylık vergi özetini PDF olarak indir ve buraya yükle. BAS’taki G1, 1A ve 1B kesin rakamlarla hesaplanır.')}</p>`}</div>`;
}
function uberSumList(key) {
  const qi = qInfo(key), xs = Object.values(D.money.uberSums).filter((x) => x.start >= qi.startId && x.start <= qi.endId).sort((a, b) => a.start.localeCompare(b.start));
  if (!xs.length) return '';
  return `<div class="list" id="ubList">${xs.map((x) => `<div class="hold"><span class="sym">${ico('receipt')}</span><span class="mid"><b>${dShort(x.start)} – ${dShort(x.end)}</b><span>${T('G1 {a} · Uber kesintileri {b}', { a: usd2(x.g1), b: usd2(x.deductions) })}${x.km != null ? ' · ' + T('{k} km', { k: fmtKm(x.km) }) : ''}</span></span><button type="button" class="del${U.armed === sumKey(x) ? ' arm' : ''}" data-act="delUbSum" data-id="${sumKey(x)}" aria-label="${T('Sil')}">${U.armed === sumKey(x) ? T('Sil?') : ico('x')}</button></div>`).join('')}</div>`;
}

// ---------- daily expenses: add / find / delete with undo ----------
function addDaily(day, name, amount, cat, oneOff) {
  const w = weekObj(idOf(mondayOf(parseKey(day))));
  const e = { id: uid(), date: day, name: name || (cat ? dcatName(cat) : T('Harcama')), amount: r2(amount), cat: cat || null };
  if (oneOff) e.oneOff = true; w.daily.push(e); return e;
}
function findDaily(id) {
  for (const [week, w] of Object.entries(D.money.weeks)) { const i = (w.daily || []).findIndex((x) => x.id === id); if (i >= 0) return { week, w, i, x: w.daily[i] }; }
  return null;
}
let lastDeleted = null, undoTimer = null;
function deleteDaily(id) {
  const f = findDaily(id); if (!f) return;
  f.w.daily.splice(f.i, 1); lastDeleted = { week: f.week, i: f.i, x: f.x }; if (f.x.acc) accAdjust(f.x.acc, +f.x.amount || 0);
  save(); render();
  toastAction(T('Silindi: {x} ({y})', { x: f.x.name || T('Harcama'), y: money(+f.x.amount || 0) }), T('Geri al'));
}
function undoDelete() {
  if (!lastDeleted) return; const w = weekObj(lastDeleted.week);
  w.daily.splice(Math.min(lastDeleted.i, w.daily.length), 0, lastDeleted.x); if (lastDeleted.x.acc) accAdjust(lastDeleted.x.acc, -(+lastDeleted.x.amount || 0)); lastDeleted = null;
  const t = $('toast'); if (t) t.hidden = true; clearTimeout(undoTimer); save(); render();
}

}

// ---------- swipe left to delete (pointer events, ~80px threshold) ----------
let swipe = null, swipeSuppress = false;
document.addEventListener('pointerdown', (e) => {
  const fg = e.target.closest('.swipe-fg'); if (!fg || e.button > 0) return;
  swipe = { fg, row: fg.parentElement, x: e.clientX, y: e.clientY, dx: 0, on: false, pid: e.pointerId };
});
document.addEventListener('pointermove', (e) => {
  if (!swipe || e.pointerId !== swipe.pid) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (!swipe.on) { if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { swipe.on = true; try { swipe.fg.setPointerCapture(e.pointerId); } catch (err) {} swipe.row.classList.add('swiping'); } else return; }
  swipe.dx = Math.max(-160, Math.min(0, dx));
  swipe.fg.style.transform = `translateX(${swipe.dx}px)`;
  swipe.row.classList.toggle('armed', swipe.dx <= -80);
});
function endSwipe(e) {
  if (!swipe || (e && e.pointerId !== swipe.pid)) return;
  const s = swipe; swipe = null; if (!s.on) return;
  swipeSuppress = true; setTimeout(() => { swipeSuppress = false; }, 350);
  s.row.classList.remove('swiping');
  // full swipe deletes; a partial swipe leaves the red "Sil" button revealed to tap
  if (s.dx <= -120) { s.fg.style.transform = 'translateX(-110%)'; const id = s.row.dataset.swipe; setTimeout(() => deleteDaily(id), 140); }
  else if (s.dx <= -40) { s.fg.style.transform = 'translateX(-96px)'; s.row.classList.add('open'); }
  else { s.fg.style.transform = ''; s.row.classList.remove('armed', 'open'); }
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', endSwipe);

// ===================== swipe navigation =====================
// Horizontal swipe (|dx| >= 60 and |dx| > 1.5|dy|) switches bottom tabs; on the week header/hero it changes week,
// on the Vergi quarter header changes quarter, on a sub-tab bar switches sub-tab. Never on inputs, spending rows,
// horizontally scrollable elements or overlays.
const TAB_ORDER = ['bugun', 'para', 'gelisim', 'saglik', 'yatirim'];
const SEGS = { paraSeg: ['hafta', 'rapor', 'gecmis', 'kumbara', 'vergi'], gelSeg: ['aliskanlik', 'gorev', 'hedef', 'kitap', 'gunluk'] };
let nav = null, navSuppressUntil = 0;
function hScrollable(el) {
  for (let n = el; n && n !== document.body; n = n.parentElement) {
    const cs = getComputedStyle(n); if (/(auto|scroll)/.test(cs.overflowX) && n.scrollWidth > n.clientWidth + 2) return true;
  }
  return false;
}
document.addEventListener('pointerdown', (e) => {
  nav = null;
  if (e.button > 0 || U.sheet || U.page) return;
  const t = e.target;
  if (!t.closest || !t.closest('#view') || t.closest('input, textarea, select, [contenteditable], .swipe, .tbl-wrap, .months-scroll') || hScrollable(t)) return;
  nav = { x: e.clientX, y: e.clientY, zone: (t.closest('[data-swipe-zone]') || {}).dataset ? t.closest('[data-swipe-zone]').dataset.swipeZone : 'tab', pid: e.pointerId };
});
document.addEventListener('pointerup', (e) => {
  const n = nav; nav = null; if (!n || e.pointerId !== n.pid) return;
  const dx = e.clientX - n.x, dy = e.clientY - n.y;
  if (Math.abs(dx) < 60 || Math.abs(dx) <= 1.5 * Math.abs(dy)) return;
  const dir = dx < 0 ? 1 : -1; // swipe left → next
  navSuppressUntil = e.timeStamp + 400; // event clock: monotonic, immune to system-time changes
  if (!D.ui.swipeHintSeen) { D.ui.swipeHintSeen = true; save(); }
  if (n.zone === 'week' && U.tab === 'para' && (U.paraSeg === 'hafta' || U.paraSeg === 'rapor')) { const d = fromId(U.cur); d.setDate(d.getDate() + 7 * dir); U.cur = idOf(d); render(dir); return; }
  if (n.zone === 'quarter' && U.tab === 'para' && U.paraSeg === 'vergi') { U.taxQ = qShift(U.taxQ, dir); render(dir); return; }
  if (n.zone === 'paraSeg' || n.zone === 'gelSeg') { const list = SEGS[n.zone], cur = U[n.zone], i = list.indexOf(cur) + dir; if (i >= 0 && i < list.length) { U[n.zone] = list[i]; render(dir); } return; }
  const i = TAB_ORDER.indexOf(U.tab) + dir; if (i < 0 || i >= TAB_ORDER.length) return;
  U.tab = TAB_ORDER[i]; U.armed = null; try { localStorage.setItem(TAB_KEY, U.tab); } catch (err) {}
  render(dir); window.scrollTo({ top: 0 }); if (U.tab === 'yatirim') refreshPrices(false);
});
document.addEventListener('pointercancel', () => { nav = null; });
// a swipe that ends on a button must not also "tap" it
document.addEventListener('click', (e) => { if (e.timeStamp < navSuppressUntil && e.target.closest && e.target.closest('#view')) { e.stopPropagation(); e.preventDefault(); } }, true);

// remember which collapsible cards (details with an id) the user opened or closed
document.addEventListener('toggle', (e) => { const t = e.target; if (t && t.tagName === 'DETAILS' && t.id) (U.fold = U.fold || {})[t.id] = t.open; }, true);
// a half-swiped row (red "Sil" showing) closes when you tap anywhere else
document.addEventListener('pointerdown', (e) => {
  document.querySelectorAll('.swipe.open').forEach((r) => { if (r.contains(e.target)) return; r.classList.remove('open', 'armed'); const fg = r.querySelector('.swipe-fg'); if (fg) fg.style.transform = ''; });
}, true);
