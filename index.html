<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Momentum</title>
<meta name="description" content="Bütçe, alışkanlık, sağlık ve yatırım: tek telefonda, tek elle.">
<meta name="theme-color" content="#f6f3ee">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Momentum">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Momentum: warm paper base, one card shape, each area owns one accent (Para bordo, Gelişim eucalyptus, Sağlık slate, Yatırım navy); gold is reserved for milestones.
   Bordo stays bordo in both themes: dark mode fills with deep wine + light text, and uses a desaturated claret for text/lines (never pink). */
:root {
  --bg: #f6f3ee; --surface: #fffdfa; --surface-2: #f1ece5; --surface-3: #e9e2d8;
  --ink: #1f1b17; --ink-2: #554d45; --ink-3: #6b625a; --line: #e6dfd5; --line-strong: #d1c7b9;
  --bug: #2b2520; --bug-ink: #fffdfa; --bug-soft: #ebe5dc; --bug-text: #2b2520; --bug-line: #2b2520;
  --para: #7b1e3c; --para-ink: #fff8f4; --para-soft: #efe3dc; --para-text: #7b1e3c; --para-line: #7b1e3c;
  --gel: #2b6a5a; --gel-ink: #ffffff; --gel-soft: #dfece7; --gel-text: #245a4d; --gel-line: #2b6a5a;
  --sag: #3b5b8c; --sag-ink: #ffffff; --sag-soft: #e3e9f2; --sag-text: #34517d; --sag-line: #3b5b8c;
  --yat: #1f2a44; --yat-ink: #ffffff; --yat-soft: #e2e5ee; --yat-text: #1f2a44; --yat-line: #1f2a44;
  --gold: #885d0a; --gold-soft: #f6ead0; --gold-line: #d4ab4f;
  --gain: #3c7334; --gain-soft: #e4efdc; --loss: #b0402a; --loss-ink: #ffffff; --loss-soft: #f8e4da;
  --warn: #94500a; --warn-soft: #f9ecd9;
  --hero-para: #6b1832; --hero-para-tile: #7e2640; --hero-para-line: #8b3149;
  --hero-yat: #1f2a44; --hero-yat-tile: #2c3a5c; --hero-yat-line: #34446a;
  --hero-ink: #ffffff; --hero-ink-2: #ece1da; --hero-warn: #ffcf8f; --hero-gain: #b4e39c; --hero-loss: #ffbfa3;
  --tabbar: rgba(255, 253, 250, 0.94); --scrim: rgba(24, 18, 14, 0.42);
  --card-shadow: 0 1px 2px rgba(50, 35, 20, 0.05), 0 8px 22px -16px rgba(50, 35, 20, 0.22);
  --hero-shadow: 0 14px 30px -18px rgba(60, 20, 25, 0.6);
  --f-display: "Bricolage Grotesque", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", Roboto, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14110f; --surface: #1e1a17; --surface-2: #28231f; --surface-3: #332c27;
    --ink: #f3eee8; --ink-2: #cdc3b8; --ink-3: #a3988d; --line: #332c27; --line-strong: #4a4039;
    --bug: #ece5dc; --bug-ink: #14110f; --bug-soft: #312a25; --bug-text: #ece5dc; --bug-line: #ece5dc;
    --para: #7b1e3c; --para-ink: #f8ece6; --para-soft: #3a1a20; --para-text: #d0867c; --para-line: #c47a70;
    --gel: #6fc2ad; --gel-ink: #0c1a16; --gel-soft: #18362f; --gel-text: #8dd2c0; --gel-line: #6fc2ad;
    --sag: #8fb0e3; --sag-ink: #0f1726; --sag-soft: #1f2b40; --sag-text: #a9c3ec; --sag-line: #8fb0e3;
    --yat: #a4b4da; --yat-ink: #10141f; --yat-soft: #252c3d; --yat-text: #bac7e6; --yat-line: #a4b4da;
    --gold: #e4b552; --gold-soft: #3a2f17; --gold-line: #a07d2c;
    --gain: #9fcf82; --gain-soft: #22331b; --loss: #ff8a66; --loss-ink: #2a0f08; --loss-soft: #3d221a;
    --warn: #f2b54a; --warn-soft: #3a2c12;
    --hero-para: #5a1428; --hero-para-tile: #6e1e35; --hero-para-line: #7b2a42;
    --hero-yat: #1a2236; --hero-yat-tile: #263150; --hero-yat-line: #303d60;
    --hero-ink: #ffffff; --hero-ink-2: #e3d6cf; --hero-warn: #ffcf8f; --hero-gain: #b4e39c; --hero-loss: #ffbfa3;
    --tabbar: rgba(30, 26, 23, 0.95); --scrim: rgba(0, 0, 0, 0.6);
    --card-shadow: 0 1px 0 rgba(255, 255, 255, 0.03), 0 8px 22px -16px rgba(0, 0, 0, 0.7);
    --hero-shadow: 0 14px 30px -18px rgba(0, 0, 0, 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14110f; --surface: #1e1a17; --surface-2: #28231f; --surface-3: #332c27;
  --ink: #f3eee8; --ink-2: #cdc3b8; --ink-3: #a3988d; --line: #332c27; --line-strong: #4a4039;
  --bug: #ece5dc; --bug-ink: #14110f; --bug-soft: #312a25; --bug-text: #ece5dc; --bug-line: #ece5dc;
  --para: #7b1e3c; --para-ink: #f8ece6; --para-soft: #3a1a20; --para-text: #d0867c; --para-line: #c47a70;
  --gel: #6fc2ad; --gel-ink: #0c1a16; --gel-soft: #18362f; --gel-text: #8dd2c0; --gel-line: #6fc2ad;
  --sag: #8fb0e3; --sag-ink: #0f1726; --sag-soft: #1f2b40; --sag-text: #a9c3ec; --sag-line: #8fb0e3;
  --yat: #a4b4da; --yat-ink: #10141f; --yat-soft: #252c3d; --yat-text: #bac7e6; --yat-line: #a4b4da;
  --gold: #e4b552; --gold-soft: #3a2f17; --gold-line: #a07d2c;
  --gain: #9fcf82; --gain-soft: #22331b; --loss: #ff8a66; --loss-ink: #2a0f08; --loss-soft: #3d221a;
  --warn: #f2b54a; --warn-soft: #3a2c12;
  --hero-para: #5a1428; --hero-para-tile: #6e1e35; --hero-para-line: #7b2a42;
  --hero-yat: #1a2236; --hero-yat-tile: #263150; --hero-yat-line: #303d60;
  --hero-ink: #ffffff; --hero-ink-2: #e3d6cf; --hero-warn: #ffcf8f; --hero-gain: #b4e39c; --hero-loss: #ffbfa3;
  --tabbar: rgba(30, 26, 23, 0.95); --scrim: rgba(0, 0, 0, 0.6);
  --card-shadow: 0 1px 0 rgba(255, 255, 255, 0.03), 0 8px 22px -16px rgba(0, 0, 0, 0.7);
  --hero-shadow: 0 14px 30px -18px rgba(0, 0, 0, 0.8);
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

/* area accent scopes */
.a-bug { --acc: var(--bug); --acc-ink: var(--bug-ink); --acc-soft: var(--bug-soft); --acc-text: var(--bug-text); --acc-line: var(--bug-line); }
.a-para { --acc: var(--para); --acc-ink: var(--para-ink); --acc-soft: var(--para-soft); --acc-text: var(--para-text); --acc-line: var(--para-line); --hero-bg: var(--hero-para); --hero-tile: var(--hero-para-tile); --hero-line: var(--hero-para-line); }
.a-gel { --acc: var(--gel); --acc-ink: var(--gel-ink); --acc-soft: var(--gel-soft); --acc-text: var(--gel-text); --acc-line: var(--gel-line); }
.a-sag { --acc: var(--sag); --acc-ink: var(--sag-ink); --acc-soft: var(--sag-soft); --acc-text: var(--sag-text); --acc-line: var(--sag-line); }
.a-yat { --acc: var(--yat); --acc-ink: var(--yat-ink); --acc-soft: var(--yat-soft); --acc-text: var(--yat-text); --acc-line: var(--yat-line); --hero-bg: var(--hero-yat); --hero-tile: var(--hero-yat-tile); --hero-line: var(--hero-yat-line); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.num, .tile .v, .receipt dd, td, .month .mv, .wk .wr, .money input, .big .v { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--acc-line, var(--ink)); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; letter-spacing: -0.01em; }

.wrap { max-width: 560px; margin: 0 auto; padding: calc(8px + env(safe-area-inset-top, 0px)) 16px calc(168px + env(safe-area-inset-bottom, 0px)); }
main { display: grid; gap: 12px; min-width: 0; }

/* top bar */
.top { position: sticky; top: 0; z-index: 12; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; margin: 0 -16px 6px; padding: env(safe-area-inset-top, 0px) 16px 0; background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 32px; height: 32px; flex: none; }
.top h1 { font-weight: 800; font-size: 1.35rem; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 44px; height: 44px; border-radius: 14px; border: 0; background: var(--surface); color: var(--ink); display: grid; place-items: center; box-shadow: var(--card-shadow); flex: none; }
.iconbtn.flat { background: var(--surface-2); box-shadow: none; }
.iconbtn .i { width: 22px; height: 22px; }

/* card */
.card { background: var(--surface); border-radius: 16px; padding: 16px; box-shadow: var(--card-shadow); min-width: 0; }
.card.tight { padding: 12px; }
.card-head { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; min-width: 0; }
.card-head h2, .card-title { font-family: var(--f-display); font-weight: 600; font-size: 1.06rem; line-height: 1.2; margin: 0; min-width: 0; flex: 1; }
.card-head .sub { font-size: 0.8rem; color: var(--ink-3); white-space: nowrap; }
.ico { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--acc-soft); color: var(--acc-text); flex: none; }
.ico .i { width: 19px; height: 19px; }
.ico.gold { background: var(--gold-soft); color: var(--gold); }
.link { background: none; border: 0; color: var(--acc-text); font-weight: 600; font-size: 0.88rem; min-height: 44px; padding: 0 4px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.link .i { width: 16px; height: 16px; }
.note { font-size: 0.8rem; color: var(--ink-3); margin: 10px 0 0; line-height: 1.45; }
.eyebrow { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.stack { display: grid; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 0.74rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.acc { background: var(--acc-soft); color: var(--acc-text); }
.chip.gold { background: var(--gold-soft); color: var(--gold); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.gain { background: var(--gain-soft); color: var(--gain); }
.chip.loss { background: var(--loss-soft); color: var(--loss); }
.chip .i { width: 13px; height: 13px; }
.banner { display: flex; align-items: center; gap: 10px; background: var(--gold-soft); color: var(--ink); border-radius: 16px; padding: 10px 8px 10px 14px; font-size: 0.9rem; }
.banner span { flex: 1; min-width: 0; }
.banner .link { color: var(--ink-2); }

/* segmented */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 3px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); min-width: 0; }
.seg button { border: 0; background: transparent; border-radius: 11px; min-height: 40px; padding: 0 6px; font-size: 0.86rem; font-weight: 600; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.seg button[aria-pressed="true"] { background: var(--acc); color: var(--acc-ink); }
.seg.top-seg { display: flex; }
.seg.top-seg button { flex: 1 1 auto; min-width: auto; font-size: 0.8rem; padding: 0 6px; overflow: visible; }
.seg.top-seg { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 11; box-shadow: 0 6px 12px -10px rgba(0,0,0,.3); }
.seg.inline { display: inline-grid; width: auto; }

/* fields */
.fields { display: grid; gap: 14px 12px; align-items: start; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.field { display: grid; gap: 5px; min-width: 0; }
.field label, .field .lab { font-weight: 600; font-size: 0.88rem; }
.field.inline { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.field.inline .seg { flex: none; }
.field .hint { font-size: 0.76rem; color: var(--ink-3); line-height: 1.35; }
.money { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface-2); padding-inline: 12px; min-width: 0; min-height: 48px; }
.money span { color: var(--ink-3); font-size: 0.95rem; font-weight: 600; }
.money input { border: 0; background: transparent; color: var(--ink); font-size: 1.05rem; font-weight: 600; padding: 10px 6px; width: 100%; min-width: 0; outline: none; }
.money input::placeholder { color: var(--ink-3); font-weight: 500; }
.money:focus-within, .txt:focus { border-color: var(--acc-line); box-shadow: 0 0 0 3px var(--acc-soft); }
.txt { border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface-2); color: var(--ink); padding: 11px 12px; min-height: 48px; width: 100%; min-width: 0; outline: none; }
textarea.txt { resize: vertical; min-height: 72px; line-height: 1.4; }
select.txt { appearance: auto; }
.txt::placeholder { color: var(--ink-3); }
.row { display: flex; gap: 8px; align-items: center; min-width: 0; }
.row > .txt { flex: 1 1 auto; width: 0; }
.row .money { flex: 0 0 auto; width: 112px; }
.del { flex: none; width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--surface-2); color: var(--ink-3); display: grid; place-items: center; }
.del .i { width: 18px; height: 18px; }
.del.arm { width: auto; padding: 0 12px; background: var(--loss); color: var(--loss-ink); font-weight: 600; font-size: 0.85rem; }
.list { display: grid; gap: 8px; }
.add { margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 600; font-size: 0.9rem; color: var(--acc-text); background: transparent; border: 1.5px dashed var(--acc-line); border-radius: 12px; padding: 8px 14px 8px 11px; }
.add .i { width: 18px; height: 18px; stroke-width: 2.2; }
.empty-txt { color: var(--ink-3); font-size: 0.88rem; margin: 0; padding: 12px; border: 1.5px dashed var(--line-strong); border-radius: 12px; text-align: center; }

/* buttons */
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font-weight: 600; font-size: 0.92rem; min-height: 46px; padding: 10px 16px; border-radius: 13px; border: 1.5px solid var(--acc); background: var(--acc); color: var(--acc-ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn .i { width: 18px; height: 18px; }
.btn.ghost { background: transparent; border-color: var(--acc-line); color: var(--acc-text); }
.btn.soft { background: var(--surface-2); border-color: var(--surface-2); color: var(--ink); }
.btn.sm { min-height: 44px; padding: 6px 12px; font-size: 0.86rem; border-radius: 11px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn:not(:disabled):active, .iconbtn:active, .add:active, .seg button:active { transform: translateY(1px); }
.btn, .iconbtn, .add { transition: transform 0.08s ease, background-color 0.15s ease; }
.confirm { display: grid; gap: 10px; margin-top: 12px; padding: 14px; border-radius: 14px; background: var(--acc-soft); font-size: 0.9rem; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.tiles > .tile:last-child:nth-child(odd):not(:first-child) { grid-column: 1 / -1; }
.tile { display: grid; gap: 1px; padding: 11px 12px; border-radius: 14px; background: var(--surface-2); min-width: 0; align-content: start; text-align: left; border: 0; color: var(--ink); }
.tile .k { font-size: 0.8rem; color: var(--ink-2); font-weight: 500; }
.tile .v { font-weight: 700; font-size: 1.15rem; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.tile .u { font-size: 0.74rem; color: var(--ink-3); line-height: 1.35; }

/* hero (Para, Yatırım) */
.hero { position: relative; overflow: hidden; isolation: isolate; display: grid; gap: 16px; background: var(--hero-bg); background-image: radial-gradient(120% 85% at 100% 0%, var(--hero-tile) 0%, transparent 60%); color: var(--hero-ink); border-radius: 16px; padding: 18px 16px 16px; box-shadow: var(--hero-shadow); }
.hero-deco { position: absolute; z-index: -1; right: -56px; top: -64px; width: 210px; height: 210px; fill: none; stroke: var(--hero-line); stroke-width: 1.5; }
.big { display: grid; gap: 4px; min-width: 0; }
.big .k { font-size: 0.9rem; color: var(--hero-ink-2); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.big .v { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.6rem, 13vw, 3.6rem); line-height: 0.95; letter-spacing: -0.035em; margin-block: 2px; overflow-wrap: anywhere; }
.big .v.neg { color: var(--hero-warn); }
.big .u { font-size: 0.84rem; color: var(--hero-ink-2); }
.hero .tile { background: var(--hero-tile); color: var(--hero-ink); }
.hero .tile .k, .hero .tile .u { color: var(--hero-ink-2); }
.hero .up { color: var(--hero-gain); } .hero .down { color: var(--hero-loss); }
.hero .iconbtn { background: var(--hero-tile); color: var(--hero-ink); box-shadow: none; width: 40px; height: 40px; }
.hero-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hero .chip { background: var(--hero-tile); color: var(--hero-ink-2); }

/* bottom nav */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; gap: 2px; background: var(--tabbar); border-top: 1px solid var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  padding: 6px max(6px, calc((100% - 560px) / 2)) calc(8px + env(safe-area-inset-bottom, 0px)); }
.tabs button { flex: 1; min-width: 0; min-height: 58px; display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 0.74rem; font-weight: 600; border: 0; background: transparent; color: var(--ink-2); padding: 2px 0; border-radius: 14px; }
.tabs .pill { display: grid; place-items: center; width: 54px; height: 32px; border-radius: 999px; transition: background-color 0.2s ease; }
.tabs .i { width: 22px; height: 22px; }
.tabs button[aria-selected="true"] { color: var(--ink); }
.tabs button[aria-selected="true"] .pill { background: var(--acc-soft); color: var(--acc-text); }
.tabs button[aria-selected="true"] .i { stroke-width: 2.1; }

/* FAB */
.fab { position: fixed; z-index: 19; right: max(16px, calc((100% - 560px) / 2 + 16px)); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 18px; border: 0; background: var(--bug); color: var(--bug-ink); display: grid; place-items: center; box-shadow: 0 10px 24px -10px rgba(0,0,0,.55); }
.fab .i { width: 26px; height: 26px; stroke-width: 2.2; }

/* toast */
.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(156px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 0.9rem; font-weight: 600; box-shadow: 0 10px 24px -12px rgba(0,0,0,.5); }

/* sheets & pages */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px)); max-height: 88vh; overflow: auto; display: grid; gap: 12px; animation: sheet-in 0.22s ease-out; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line-strong); margin: 4px auto 2px; }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head h2 { flex: 1; font-size: 1.2rem; font-weight: 700; }
@keyframes sheet-in { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.page { position: fixed; inset: 0; z-index: 45; background: var(--bg); overflow-y: auto; overflow-x: hidden; animation: page-in 0.2s ease-out; }
.page .wrap { padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
.page main { gap: 14px; }
@keyframes page-in { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.group-title { display: flex; align-items: center; gap: 10px; margin: 10px 2px -2px; font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; }
.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.quick button { display: grid; justify-items: center; gap: 6px; padding: 14px 4px; min-height: 88px; border-radius: 14px; border: 0; background: var(--surface); color: var(--ink); font-weight: 600; font-size: 0.84rem; box-shadow: var(--card-shadow); }
.quick button[aria-pressed="true"] { outline: 2px solid var(--acc-line); }
.quick .ico { width: 38px; height: 38px; }

/* Bugün */
.greet h2 { font-size: 1.55rem; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; margin-top: 2px; }
.greet { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 10px; padding: 2px 2px 4px; }
.xp { display: inline-flex; align-items: center; gap: 6px; font-size: 0.74rem; font-weight: 600; color: var(--ink-2); background: var(--surface); padding: 5px 10px; border-radius: 999px; box-shadow: var(--card-shadow); white-space: nowrap; }
.xp i { display: block; width: 36px; height: 5px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.xp i b { display: block; height: 100%; background: var(--gold-line); }
.strip { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 0; padding: 0; overflow: hidden; border: 0; width: 100%; text-align: left; color: var(--ink); }
.strip > div { padding: 12px 12px 13px; display: grid; gap: 1px; min-width: 0; }
.strip > div + div { border-left: 1px solid var(--line); }
.strip .k { font-size: 0.74rem; color: var(--ink-3); font-weight: 600; line-height: 1.25; }
.strip > div { align-content: space-between; }
.strip .v { font-family: var(--f-display); font-weight: 700; font-size: 1.08rem; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .v.hero-n { color: var(--acc-text); font-size: 1.35rem; }
.strip-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 0; font-size: 0.8rem; font-weight: 600; color: var(--ink-2); }
.strip-wrap { padding: 0; overflow: hidden; }
.strip-wrap > button:first-child { all: unset; display: block; width: 100%; cursor: pointer; box-sizing: border-box; }
.band { display: grid; gap: 8px; }
.band + .band { margin-top: 12px; }
.band-h { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
.band-h .i { width: 15px; height: 15px; }
.htiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.htile { display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 10px 12px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); text-align: left; color: var(--ink); min-width: 0; }
.htile .chk { width: 28px; height: 28px; flex: none; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; }
.htile .chk .i { width: 16px; height: 16px; stroke-width: 3; opacity: 0; }
.htile span.n { font-weight: 600; font-size: 0.9rem; line-height: 1.25; min-width: 0; overflow-wrap: anywhere; }
.htile[aria-pressed="true"] { background: var(--acc-soft); border-color: transparent; }
.htile[aria-pressed="true"] .chk { background: var(--acc); border-color: var(--acc-line); color: var(--acc-ink); }
.htile[aria-pressed="true"] .chk .i { opacity: 1; }
.htile[aria-pressed="true"] span.n { color: var(--ink-2); }
.task { display: flex; align-items: center; gap: 6px; min-height: 52px; padding: 4px 4px 4px 2px; border-bottom: 1px solid var(--line); }
.list .task:last-child { border-bottom: 0; }
.tick { flex: none; width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; padding: 0; }
.tick span { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line-strong); display: grid; place-items: center; }
.tick .i { width: 14px; height: 14px; stroke-width: 3; opacity: 0; }
.done > .tick span, .tick[aria-pressed="true"] span { background: var(--acc); border-color: var(--acc-line); color: var(--acc-ink); }
.done > .tick .i, .tick[aria-pressed="true"] .i { opacity: 1; }
.task .t { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 0.95rem; }
.task.done .t { color: var(--ink-3); text-decoration: line-through; }
.counters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.counter { background: var(--surface-2); border-radius: 14px; padding: 10px; display: grid; gap: 6px; min-width: 0; }
.counter .lbl { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 0.84rem; font-weight: 600; color: var(--ink-2); }
.counter .ctl { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.counter .ctl b { font-family: var(--f-display); font-size: 1.8rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.rb { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--surface); color: var(--ink); display: grid; place-items: center; }
.rb.plus { background: var(--acc); color: var(--acc-ink); }
.rb .i { width: 20px; height: 20px; stroke-width: 2.3; }
.counter .hint { font-size: 0.74rem; color: var(--ink-3); min-height: 1.1em; }
.snap { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.snap .tile .v { font-size: 1.05rem; }
.insight { display: flex; gap: 12px; align-items: flex-start; }
.insight p { margin: 0; flex: 1; font-size: 0.95rem; line-height: 1.45; }
.insight-actions { display: flex; justify-content: space-between; margin: 6px -4px -8px; }
.moods { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.mood { display: grid; justify-items: center; gap: 2px; padding: 8px 0 6px; min-height: 64px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 0.72rem; font-weight: 600; }
.mood .i { width: 26px; height: 26px; }
.mood[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.tagbtn { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-2); font-weight: 600; font-size: 0.86rem; }
.tagbtn[aria-pressed="true"] { background: var(--acc-soft); border-color: var(--acc-line); color: var(--acc-text); }
.pline { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; text-align: left; color: var(--ink); }
.pline .t { flex: 1; min-width: 0; font-weight: 600; }

/* gains */
.up { color: var(--gain); } .down { color: var(--loss); }
.delta { display: inline-flex; align-items: center; gap: 2px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta .i { width: 13px; height: 13px; stroke-width: 2.6; }

/* receipt */
.slip { position: relative; border-bottom-left-radius: 0; border-bottom-right-radius: 0; margin-bottom: 9px; }
.slip::after { content: ""; position: absolute; left: 0; right: 0; bottom: -9px; height: 10px;
  background: linear-gradient(135deg, var(--surface) 50%, transparent 50%) 0 0 / 14px 10px repeat-x, linear-gradient(-135deg, var(--surface) 50%, transparent 50%) 0 0 / 14px 10px repeat-x; }
.receipt { display: grid; margin: 0; }
.receipt div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line-strong); }
.receipt dt { color: var(--ink-2); min-width: 0; }
.receipt dd { margin: 0; white-space: nowrap; font-weight: 600; }
.receipt .tot { border-bottom: 0; border-top: 2px solid var(--ink); margin-top: 6px; padding-top: 12px; }
.receipt .tot dt { color: var(--ink); font-weight: 700; }
.receipt .tot dd { font-family: var(--f-display); font-weight: 800; color: var(--acc-text); font-size: 1.4rem; letter-spacing: -0.02em; }
.weeknav { display: flex; align-items: center; gap: 6px; background: var(--surface); border-radius: 16px; padding: 5px; box-shadow: var(--card-shadow); }
.weeknav button, .yearnav button { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--surface-2); color: var(--ink); display: grid; place-items: center; flex: none; }
.weeknav .lbl { flex: 1; text-align: center; font-weight: 700; font-size: 1rem; min-width: 0; line-height: 1.25; }
.weeknav .lbl small { display: block; font-weight: 500; color: var(--ink-3); font-size: 0.78rem; }

/* history table */
.tbl-wrap { overflow-x: auto; margin-inline: -16px; padding-inline: 16px; }
table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
th, td { text-align: right; padding: 12px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
th { font-size: 0.74rem; color: var(--ink-3); font-weight: 600; padding-top: 0; }
td:first-child { font-weight: 600; }
td:last-child { font-weight: 700; }
tbody tr.go { cursor: pointer; }
tr.cur td { color: var(--acc-text); }
td.neg { color: var(--warn); }

/* calendar */
.yearnav { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.ylbl { flex: 1; text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; line-height: 1.1; min-width: 0; }
.ylbl small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 0.8rem; color: var(--ink-3); margin-top: 2px; }
.months { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.month { display: grid; gap: 1px; text-align: left; color: var(--ink); background: var(--surface-2); border: 1.5px solid transparent; border-radius: 14px; padding: 10px 11px; min-height: 76px; min-width: 0; align-content: start; }
.month .mn { font-weight: 700; font-size: 0.9rem; }
.month .mv { font-weight: 700; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; color: var(--ink-3); }
.month .mc { font-size: 0.72rem; color: var(--ink-3); }
.month.has { background: var(--acc-soft); }
.month.has .mv { color: var(--acc-text); }
.month.neg .mv { color: var(--warn); }
.month.now { border-color: var(--line-strong); }
.month[aria-pressed="true"] { border-color: var(--acc-line); background: var(--surface); box-shadow: 0 0 0 1.5px var(--acc-line) inset; }
.wklist { display: grid; gap: 8px; margin-top: 10px; }
.wk { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 60px; color: var(--ink); text-align: left; background: var(--surface-2); border: 0; border-radius: 14px; padding: 10px 14px; width: 100%; }
.wk .wl { font-weight: 700; min-width: 0; }
.wk .wl small { display: block; font-weight: 400; font-size: 0.76rem; color: var(--ink-3); }
.wk .wr { text-align: right; flex: none; }
.wk .wr b { display: block; font-size: 1.02rem; color: var(--acc-text); }
.wk .wr small { font-size: 0.74rem; color: var(--ink-3); }
.wk.empty-wk { background: transparent; border: 1.5px dashed var(--line-strong); }
.wk.empty-wk .wl { color: var(--ink-2); }
.wk.empty-wk .wr b { color: var(--ink-3); }

/* meters */
.meter { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--acc); border-radius: 99px; transition: width 0.3s; }
.meter.gold i { background: var(--gold-line); }
.meter-l { display: flex; justify-content: space-between; gap: 8px; font-size: 0.78rem; color: var(--ink-3); margin-top: 6px; }

/* pots */
.pot { display: grid; gap: 10px; }
.pot-h { display: flex; align-items: center; gap: 10px; min-width: 0; }
.pot-h .nm { flex: 1; min-width: 0; }
.pot-h h3 { font-size: 1.05rem; font-weight: 700; overflow-wrap: anywhere; }
.pot-h .amt { font-size: 0.84rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pot-ctl { display: flex; gap: 8px; align-items: center; }
.pot-ctl .money { flex: 1; }
.iconpick { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.iconpick button { height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-2); display: grid; place-items: center; }
.iconpick button[aria-pressed="true"] { border-color: var(--acc-line); background: var(--acc-soft); color: var(--acc-text); }
details.fold > summary { cursor: pointer; color: var(--ink-3); font-size: 0.84rem; min-height: 40px; display: flex; align-items: center; list-style: none; }
details.fold > summary::-webkit-details-marker { display: none; }
.log { display: grid; gap: 4px; font-size: 0.84rem; color: var(--ink-2); }
.log div { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--line); }

/* habits (Gelişim) */
.habit { display: grid; gap: 8px; }
.habit-h { display: flex; align-items: center; gap: 8px; min-width: 0; }
.habit-h .nm { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.dots { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dot { height: 44px; border: 0; background: none; padding: 0; display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 0.68rem; color: var(--ink-3); }
.dot i { display: block; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); border: 1.5px solid var(--line-strong); }
.dot[aria-pressed="true"] i { background: var(--acc); border-color: var(--acc-line); }
.dot.today { color: var(--acc-text); font-weight: 700; }
.strength { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--ink-2); }
.strength .meter { flex: 1; height: 6px; }
.strength b { font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }

/* goals, books, journal */
.goal h3, .book h3 { font-size: 1.05rem; font-weight: 700; overflow-wrap: anywhere; }
.why { font-size: 0.85rem; color: var(--ink-2); margin-top: 2px; }
.step { display: flex; align-items: center; gap: 4px; font-size: 0.92rem; }
.step span.t { flex: 1; overflow-wrap: anywhere; min-width: 0; }
.step.done span.t { color: var(--ink-3); text-decoration: line-through; }
.mini-add { display: flex; gap: 6px; }
.mini-add .txt { flex: 1; min-height: 44px; padding: 8px 12px; }
.spine { flex: none; width: 40px; height: 56px; border-radius: 4px 8px 8px 4px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; color: #fff; font-size: 1.1rem; box-shadow: inset 4px 0 0 rgba(0,0,0,.18); }
.book-h { display: flex; gap: 12px; align-items: flex-start; }
.book-h .au { font-size: 0.85rem; color: var(--ink-2); }
.stars { display: flex; gap: 0; }
.stars button { background: none; border: 0; width: 40px; height: 44px; display: grid; place-items: center; color: var(--line-strong); padding: 0; }
.stars button.on { color: var(--gold); }
.stars .i { width: 22px; height: 22px; fill: currentColor; stroke: none; }
.entry { display: grid; gap: 4px; }
.entry .d { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--ink-3); font-weight: 600; }
.entry .d .i { width: 22px; height: 22px; color: var(--acc-text); }
.entry p { margin: 0; color: var(--ink-2); font-size: 0.92rem; }
.entry p b { color: var(--ink); font-weight: 600; }
.ring { width: 84px; height: 84px; position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.summary { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.quote { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; line-height: 1.25; }
.meta { font-size: 0.84rem; color: var(--ink-2); margin-top: 4px; }

/* health */
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--f-body); font-size: 10px; fill: var(--ink-3); }
.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.metric { background: var(--surface-2); border-radius: 14px; padding: 12px; min-width: 0; }
.metric .mh { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 0.78rem; font-weight: 600; color: var(--ink-2); }
.metric .mh small { font-size: 0.7rem; color: var(--ink-3); font-weight: 500; }
.metric b { font-family: var(--f-display); font-size: 1.5rem; font-weight: 800; display: block; margin: 2px 0 4px; font-variant-numeric: tabular-nums; }
.metric b small { font-family: var(--f-body); font-size: 0.74rem; font-weight: 500; color: var(--ink-3); margin-left: 3px; }
.parts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kv div { display: grid; gap: 1px; min-width: 0; }
.kv span { font-size: 0.76rem; color: var(--ink-3); }
.kv b { font-weight: 700; font-size: 1rem; font-variant-numeric: tabular-nums; }
.import-box { border: 1.5px dashed var(--acc-line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.import-box ol { margin: 0; padding-left: 20px; font-size: 0.86rem; color: var(--ink-2); display: grid; gap: 4px; }
.status-msg { font-size: 0.86rem; padding: 10px 12px; border-radius: 12px; background: var(--acc-soft); color: var(--ink); }
.status-msg.err { background: var(--warn-soft); color: var(--warn); }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }

/* invest */
.hold { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 8px 0; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; color: var(--ink); }
.list .hold:last-child { border-bottom: 0; }
.sym { width: 44px; height: 44px; border-radius: 12px; background: var(--acc-soft); color: var(--acc-text); display: grid; place-items: center; font-weight: 800; font-size: 0.72rem; letter-spacing: 0.02em; flex: none; overflow: hidden; }
.hold .mid { flex: 1; min-width: 0; }
.hold .mid b { display: block; font-weight: 700; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hold .mid > span { display: block; font-size: 0.76rem; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hold .rt { text-align: right; flex: none; display: grid; gap: 1px; justify-items: end; }
.hold .rt b { font-weight: 700; font-variant-numeric: tabular-nums; }
.hold .rt span { font-size: 0.78rem; }
.prev { width: 100%; font-size: 0.8rem; }
.prev th, .prev td { padding: 8px 4px; }
.mapgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.mapgrid label { font-size: 0.78rem; font-weight: 600; display: grid; gap: 4px; }

/* empty states */
.illo { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 6px 8px 4px; color: var(--ink-3); font-size: 0.88rem; }
.illo svg { width: 128px; height: auto; }
.illo b { color: var(--ink); font-size: 0.95rem; }
.illo span { max-width: 32ch; }
.illo .btns { justify-content: center; margin-top: 6px; }
.il-card { fill: var(--surface); stroke: var(--line-strong); stroke-width: 2; stroke-linejoin: round; }
.il-soft { fill: var(--acc-soft); }
.il-acc { fill: var(--acc); }
.il-line { fill: none; stroke: var(--line-strong); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.il-accline { fill: none; stroke: var(--acc-line); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.il-dash { fill: none; stroke: var(--line-strong); stroke-width: 2; stroke-dasharray: 3 3; }
.il-gold { fill: var(--gold-soft); stroke: var(--gold-line); stroke-width: 2.5; }
.il-goldline { fill: none; stroke: var(--gold); stroke-width: 2.5; stroke-linecap: round; }

/* touch feedback */
button { transition: transform 0.12s ease, background-color 0.15s ease; }
button:active { transform: scale(0.97); }
main:not([hidden]) { animation: panel-in 0.2s ease-out; }
@keyframes panel-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  button:active { transform: none; }
}

/* settings toggles */
.trow { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 52px; padding: 0 2px; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); font-weight: 500; text-align: left; }
.card > .trow:last-of-type { border-bottom: 0; }
.sw { position: relative; flex: none; width: 46px; height: 28px; border-radius: 14px; background: var(--line-strong); transition: background-color 0.15s ease; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left 0.15s ease; }
.trow[aria-pressed="true"] .sw { background: var(--acc); }
.trow[aria-pressed="true"] .sw::after { left: 21px; }
.trow:active { transform: none; }

/* tax */
.taxline { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 0 12px; border: 0; border-top: 1px solid var(--line); background: var(--acc-soft); color: var(--acc-text); font-weight: 600; font-size: 0.86rem; text-align: left; }
.taxline span { flex: 1; min-width: 0; }
.taxline .i { width: 17px; height: 17px; }
.receipt .sub-tot dt, .receipt .sub-tot dd { font-weight: 700; color: var(--ink); }
.tags-mini { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }
.hold .sym .i { width: 20px; height: 20px; }
input[type="date"].txt { min-height: 48px; }

.hold.wrap .mid b, .hold.wrap .mid > span { white-space: normal; overflow-wrap: anywhere; }

/* round 3: top bar actions, settings sections, daily expenses, swipe, undo toast */
.top-acts { display: flex; gap: 8px; align-items: center; flex: none; }
.sec-gear .i { width: 20px; height: 20px; }
.crumb { display: grid; min-width: 0; }
.crumb small { font-size: 0.76rem; color: var(--ink-3); font-weight: 600; line-height: 1.1; }
.crumb h1 { font-weight: 800; font-size: 1.3rem; line-height: 1.1; }
.setlist { padding: 4px 12px; }
.setrow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 8px 2px; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); text-align: left; }
.setrow:last-child { border-bottom: 0; }
.setrow .st { flex: 1; min-width: 0; display: grid; gap: 1px; }
.setrow .st b { font-weight: 700; font-size: 1rem; }
.setrow .st small { font-size: 0.78rem; color: var(--ink-3); overflow-wrap: anywhere; }
.setrow > .i { color: var(--ink-3); }
.days { display: grid; gap: 6px; }
.day { border-radius: 14px; background: var(--surface-2); overflow: hidden; }
.day.open { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.day-h { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 6px 12px; border: 0; background: none; color: var(--ink); text-align: left; }
.day-h .dn { flex: 1; min-width: 0; font-weight: 700; font-size: 0.95rem; }
.day-h .dn small { display: block; font-weight: 500; font-size: 0.76rem; color: var(--ink-3); }
.day-h .dt { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--acc-text); }
.day-h .i { width: 16px; height: 16px; color: var(--ink-3); }
.day-b { padding: 0 10px 12px; display: grid; gap: 10px; }
.dlist { display: grid; gap: 6px; }
.swipe { position: relative; border-radius: 12px; overflow: hidden; background: var(--loss); }
.swipe-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding-right: 16px; color: #fff; font-weight: 700; font-size: 0.9rem; opacity: 0.75; }
.swipe.armed .swipe-bg { opacity: 1; }
.swipe-bg .i { width: 18px; height: 18px; }
.swipe-fg { position: relative; display: flex; align-items: center; gap: 4px; background: var(--surface-2); touch-action: pan-y; transition: transform 0.18s ease; user-select: none; -webkit-user-select: none; }
.swipe.swiping .swipe-fg { transition: none; }
.dent { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 4px 6px 12px; background: none; border: 0; color: var(--ink); text-align: left; }
.dent .dn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dent .dn b { font-weight: 600; font-size: 0.92rem; overflow-wrap: anywhere; }
.dent .da { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.swipe-fg .del { background: transparent; }
.swipe-del { position: absolute; top: 0; right: 0; bottom: 0; width: 96px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: transparent; color: #fff; font-weight: 700; }
.swipe-bg { padding-right: 0; }
.catrow { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.catrow:last-child { border-bottom: 0; }
.catrow .cn { flex: 1; min-width: 0; font-size: 0.88rem; font-weight: 600; overflow-wrap: anywhere; }
.catrow .seg button { padding: 0 8px; min-height: 36px; font-size: 0.8rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chipbtn { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-2); font-weight: 600; font-size: 0.82rem; }
.chipbtn[aria-pressed="true"] { background: var(--acc-soft); border-color: var(--acc-line); color: var(--acc-text); }
.toast { display: flex; align-items: center; gap: 12px; }
.toast[hidden] { display: none !important; }
.toast span { min-width: 0; }
.toast-act { flex: none; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 0; background: var(--gold-line); color: #1f1b17; font-weight: 700; }

/* round 4: sync chip, notifications */
.sync-chip { display: inline-flex; align-items: center; gap: 5px; min-height: 36px; padding: 0 10px 0 8px; border-radius: 999px; border: 0; background: var(--surface); box-shadow: var(--card-shadow); color: var(--ink-2); font-size: 0.74rem; font-weight: 700; white-space: nowrap; }
.sync-chip .i { width: 17px; height: 17px; }
.sync-chip::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); order: -1; }
.sync-chip.st-ok::after { background: var(--gain); }
.sync-chip.st-syncing::after { background: var(--gold-line); }
.sync-chip.st-error::after, .sync-chip.st-wait::after { background: var(--loss); }
.sync-chip.st-offline::after { background: var(--ink-3); }
.top.has-sync .mark { display: none; }
.nrow { border-bottom: 1px solid var(--line); }
.nrow:last-child { border-bottom: 0; }
.nrow .trow { border-bottom: 0; }
.trow span small { display: block; font-size: 0.76rem; color: var(--ink-3); font-weight: 500; }
.trow:disabled { opacity: 0.55; cursor: default; }
.ntime { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 2px 10px; font-size: 0.86rem; font-weight: 600; }
.ntime .txt { width: 130px; flex: none; min-height: 44px; }

</style>

<script>
(function () {
'use strict';
// ===================== i18n =====================
// Turkish source strings are the keys (tr dictionary = identity); EN holds the English for every key (see 8-en.js).
// T(key, vars): {name} placeholders; an EN entry may be a function(vars) for plurals.
let LANG = 'tr', LOC = 'tr-TR';
const MISSING = new Set();
function T(s, v) {
  let r = s;
  if (LANG === 'en') { const e = EN[s]; if (e == null) MISSING.add(s); else r = e; }
  if (typeof r === 'function') r = r(v || {});

}
let MONTHS, MONTHS_FULL, DAYS, DAYS_LONG, nf0, nf1, nf2, nf4;
function setLocale(lang) {
  LANG = lang === 'en' ? 'en' : 'tr'; LOC = LANG === 'en' ? 'en-AU' : 'tr-TR';
  const f = (o) => new Intl.DateTimeFormat(LOC, o);
  MONTHS = [...Array(12)].map((_, m) => f({ month: 'short' }).format(new Date(2026, m, 1)).replace('.', ''));
  MONTHS_FULL = [...Array(12)].map((_, m) => f({ month: 'long' }).format(new Date(2026, m, 1)));
  DAYS = [...Array(7)].map((_, d) => f({ weekday: 'short' }).format(new Date(2026, 9, 11 + d)));
  DAYS_LONG = [...Array(7)].map((_, d) => f({ weekday: 'long' }).format(new Date(2026, 9, 11 + d)));
  nf0 = new Intl.NumberFormat(LOC, { maximumFractionDigits: 0 });
  nf1 = new Intl.NumberFormat(LOC, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  nf2 = new Intl.NumberFormat(LOC, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  nf4 = new Intl.NumberFormat(LOC, { maximumFractionDigits: 4 });
  document.documentElement.lang = LANG;
}
setLocale('tr');
// Turkish puts the percent sign first
const pct = (s) => (LANG === 'en' ? s + '%' : '%' + s);

// ===================== core: keys, utils =====================
const KEY = 'adim-adim-v2', OLD_BUDGET_KEY = 'haftalik-butce-v1', OLD_ADIM_KEY = 'adim-adim-v1', TAB_KEY = 'adim-adim-v2:tab';
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const JSZIP_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';

// ---------- defaults (budget, verbatim) ----------
const DEF_SET = { salary: 100000, fixed: 10000, weeksPerYear: 48, cover: false, fuelDefault: 180, cashRate: 30, cashTax: false, recurring: [] };
let S = JSON.parse(JSON.stringify(DEF_SET)); // budget settings; always === D.money.settings after load

// ---------- tax engine (2026-27 resident) — copied verbatim from Haftalık Bütçe ----------
const BR = [[18200, 0], [45000, 0.15], [135000, 0.30], [190000, 0.37], [Infinity, 0.45]];
function itax(ti) { let t = 0, p = 0; for (const [cap, r] of BR) { if (ti > p) t += (Math.min(ti, cap) - p) * r; p = cap; }
  let l = 0; if (ti <= 37500) l = 700; else if (ti <= 45000) l = 700 - 0.05 * (ti - 37500); else if (ti <= 66667) l = 325 - 0.015 * (ti - 45000);
  return Math.max(0, t - l); }
function mls(ti, c) { if (c || ti <= 105000) return 0; if (ti <= 123000) return 0.01 * ti; if (ti <= 164000) return 0.0125 * ti; return 0.015 * ti; }
const ttax = (ti, c) => itax(ti) + 0.02 * ti + mls(ti, c);
const sum = (arr) => (arr || []).reduce((a, x) => a + (+x.amount || 0), 0);

function weekCalc(w) {
  const N = Math.max(1, S.weeksPerYear);
  const E = +w.uberEarn || 0, H = +w.uberHours || 0;
  const fuel = E > 0 ? (w.fuel == null || w.fuel === '' ? S.fuelDefault : +w.fuel) : 0;
  const fx = E > 0 ? S.fixed / N : 0;
  const go = E / 11, gc = fuel / 11 + fx * 0.8 / 11, gst = go - gc;
  const pa = Math.max(0, ((E - go) - (fuel + fx - gc)) * N);
  const uberTax = (ttax(S.salary + pa, S.cover) - ttax(S.salary, S.cover)) / N;
  const uberNet = E - gst - fuel - fx - uberTax;
  const cashGross = (+w.cashHours || 0) * S.cashRate;
  const cashA = cashGross * N;
  const cashTax = S.cashTax ? (ttax(S.salary + pa + cashA, S.cover) - ttax(S.salary + pa, S.cover)) / N : 0;
  const cashNet = cashGross - cashTax;
  const salaryNet = (S.salary - ttax(S.salary, S.cover)) / 52;
  const rec = sum(S.recurring), extra = sum(w.extras);
  const income = salaryNet + uberNet + cashNet;
  return { E, H, fuel, fx, gst, uberTax, uberNet, netH: H > 0 ? uberNet / H : 0, cashGross, cashTax, cashNet, salaryNet, rec, extra, income, left: income - rec - extra, setAside: gst + uberTax + cashTax };
}

// ---------- dates (budget, verbatim) ----------
// MONTHS / DAYS come from Intl in 0-i18n.js (tr-TR gives the same Oca/Şub/... the budget app used)
const pad = (n) => String(n).padStart(2, '0');
const idOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromId = (id) => { const [y, m, d] = id.split('-').map(Number); return new Date(y, m - 1, d); };
function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return x; }
function weekLabel(id) { const a = fromId(id), b = new Date(a); b.setDate(b.getDate() + 6);
  return a.getMonth() === b.getMonth() ? `${a.getDate()}–${b.getDate()} ${MONTHS[a.getMonth()]}` : `${a.getDate()} ${MONTHS[a.getMonth()]} – ${b.getDate()} ${MONTHS[b.getMonth()]}`; }
function quarterOf(id) { const d = fromId(id); const m = d.getMonth(); const fy = m >= 6 ? d.getFullYear() + 1 : d.getFullYear();
  const q = m >= 6 && m <= 8 ? 1 : m >= 9 ? 2 : m <= 2 ? 3 : 4; const names = { 1: 'Tem–Eyl', 2: 'Eki–Ara', 3: 'Oca–Mar', 4: 'Nis–Haz' };
  return { key: fy + '-Q' + q, name: names[q] + ' ' + (q <= 2 ? d.getFullYear() : d.getFullYear()) }; }
function mondaysIn(y, m) { const out = []; const d = new Date(y, m, 1); while (d.getDay() !== 1) d.setDate(d.getDate() + 1); while (d.getMonth() === m) { out.push(idOf(d)); d.setDate(d.getDate() + 7); } return out; }
const keyOf = idOf;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const todayKey = () => keyOf(new Date());
const parseKey = (k) => new Date(k + 'T12:00:00');
const thisWeekId = () => idOf(mondayOf(new Date()));

// ---------- format (budget, verbatim) ----------
// nf0/nf1/nf2/nf4 are locale-aware (0-i18n.js): TR $1.234, EN $1,234
const usd = (v) => (v < -0.5 ? '−$' : '$') + nf0.format(Math.abs(Math.round(v)));
const usd2 = (v) => (v < 0 ? '−$' : '$') + nf2.format(Math.abs(v));
// One parser for every number field: accepts "11,50", "11.50", "15.9", "1.234,56", "1,234.56", "$1 234". Money is rounded to cents.
function parseNum(v, money) {
  let s = String(v == null ? '' : v).trim().replace(/[\s$€£\u00a0]|AUD|USD/gi, ''); if (!s) return null;
  let neg = /^[-−]/.test(s); s = s.replace(/^[-−]/, '');
  const hasD = s.includes('.'), hasC = s.includes(',');
  if (hasD && hasC) { const dec = s.lastIndexOf('.') > s.lastIndexOf(',') ? '.' : ','; s = s.split(dec === '.' ? ',' : '.').join('').replace(dec, '.'); }
  else if (hasC) s = /^[1-9]\d{0,2}(,\d{3})+$/.test(s) && !/^\d+,\d{1,2}$/.test(s) ? s.replace(/,/g, '') : s.replace(/,/g, '.');
  else if (hasD && money && /^[1-9]\d{0,2}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  if (!/^\d*\.?\d*$/.test(s) || s === '.' ) return null;
  let n = parseFloat(s); if (!isFinite(n)) return null; if (neg) n = -n;
  return money ? Math.round(n * 100) / 100 : n;
}
const parse = (v) => { const n = parseNum(v, true); return n == null ? '' : n; };
const cents = (v) => Math.round(Math.abs(+v || 0) * 100) % 100 !== 0;
const fmtIn = (v) => (v === '' || v == null ? '' : cents(v) ? nf2.format(v) : nf0.format(v));
// user-entered amounts keep their cents ($11,50); computed totals use usd() (whole dollars, as in the budget app)
const money = (v) => (cents(v) ? usd2(Math.round(v * 100) / 100) : usd(v));
const r2 = (v) => Math.round((+v || 0) * 100) / 100;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 9);
const num = (v) => parseNum(v, false);
const inNum = (v) => (v == null || v === '' ? '' : String(v).replace('.', LANG === 'en' ? '.' : ','));
const ico = (id, cls) => `<svg class="i${cls ? ' ' + cls : ''}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const hhmm = (t) => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dShort = (k) => { const d = parseKey(k); return d.getDate() + ' ' + MONTHS[d.getMonth()]; };

// ===================== state =====================
function blank() {
  return {
    schemaVersion: 1,
    money: { settings: clone(DEF_SET), weeks: {}, pots: [], uberExpenses: [], taxSummaries: {}, setAsides: [] },
    growth: { habits: [], log: {}, tasks: [], goals: [], books: [], bookGoal: 12, readLog: {}, journal: {}, identity: '' },
    health: { days: {}, height: null, goalWeight: null, packPrice: 40, lastImport: null },
    invest: { holdings: [], watchlist: [], prices: {}, fx: null, finnhubKey: '', showOnHome: true, lastRefresh: 0 },
    ui: { theme: 'system', lang: 'tr', hiddenCards: {}, hiddenInsights: {}, hideValues: false, notice: null }
  };
}
const isObj = (o) => o && typeof o === 'object' && !Array.isArray(o);
function applySettings(v) { D.money.settings = Object.assign(clone(DEF_SET), clone(v || {})); if (!Array.isArray(D.money.settings.recurring)) D.money.settings.recurring = []; S = D.money.settings; }
function normWeek(w) { const v = clone(w || {}); if (!Array.isArray(v.extras)) v.extras = []; if (!Array.isArray(v.daily)) v.daily = []; return v; }
function normalize(o) {
  const b = blank();
  const D0 = isObj(o) ? o : {};
  const out = b;
  ['money', 'growth', 'health', 'invest', 'ui'].forEach((k) => { if (isObj(D0[k])) out[k] = Object.assign(b[k], D0[k]); });
  const m = out.money; m.settings = Object.assign(clone(DEF_SET), isObj(m.settings) ? m.settings : {}); if (!Array.isArray(m.settings.recurring)) m.settings.recurring = [];
  if (!isObj(m.weeks)) m.weeks = {}; Object.keys(m.weeks).forEach((id) => { m.weeks[id] = normWeek(m.weeks[id]); });
  ['uberExpenses', 'setAsides'].forEach((k) => { if (!Array.isArray(m[k])) m[k] = []; }); if (!isObj(m.taxSummaries)) m.taxSummaries = {};
  if (m.settings.logbookPct == null) m.settings.logbookPct = 100;
  if (!Array.isArray(m.pots)) m.pots = []; m.pots.forEach((p) => { p.log = Array.isArray(p.log) ? p.log : []; p.saved = +p.saved || 0; p.target = +p.target || 0; p.icon = p.icon || 'jar'; });
  const g = out.growth;
  ['habits', 'tasks', 'goals', 'books'].forEach((k) => { if (!Array.isArray(g[k])) g[k] = []; });
  ['log', 'readLog', 'journal'].forEach((k) => { if (!isObj(g[k])) g[k] = {}; });
  g.habits.forEach((h) => { if (!h.band) h.band = guessBand(h.name); });
  g.tasks.forEach((t) => { if (!t.cat) t.cat = 'kisisel'; if (!t.prio) t.prio = 2; });
  g.goals.forEach((x) => { if (!Array.isArray(x.steps)) x.steps = []; });
  if (g.bookGoal == null) g.bookGoal = 12; if (g.identity == null) g.identity = '';
  const h = out.health; if (!isObj(h.days)) h.days = {}; if (h.packPrice == null) h.packPrice = 40;
  const iv = out.invest; ['holdings', 'watchlist'].forEach((k) => { if (!Array.isArray(iv[k])) iv[k] = []; }); if (!isObj(iv.prices)) iv.prices = {};
  const u = out.ui; if (u.lang !== 'en') u.lang = 'tr'; ['hiddenCards', 'hiddenInsights'].forEach((k) => { if (!isObj(u[k])) u[k] = {}; });
  out.schemaVersion = 1;
  return out;
}
function guessBand(name) {
  const n = String(name || '').toLocaleLowerCase('tr-TR');
  if (/kalk|sabah|kahvalt|meditasyon|06|07|05|wake|morning|breakfast/.test(n)) return 'sabah';
  if (/iş|çıraklık|teknik|çalış|rapor|ders|standart|work|study|apprentice/.test(n)) return 'is';
  if (/akşam|kitap|oku|harcama|yürüyüş|spor|günlük|uyku|su\b|litre|read|walk|gym|journal|water|evening/.test(n)) return 'aksam';
  return 'sabah';
}

let D = null, firstRun = false, saveTimer = null, storageOk = true;
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { storageOk = false; }
  if (raw) { try { D = normalize(JSON.parse(raw)); } catch (e) { D = normalize(null); toastLater(T('Kayıt okunamadı, uygulama boş başlatıldı.')); } }
  else {
    firstRun = true; D = normalize(null);
    // automatic migration from the old budget PWA (same origin), keep old key untouched
    try {
      const ob = JSON.parse(localStorage.getItem(OLD_BUDGET_KEY) || 'null');
      if (ob && (ob.settings || ob.weeks)) {
        applySettings(ob.settings);
        Object.entries(ob.weeks || {}).forEach(([id, w]) => { if (/^\d{4}-\d{2}-\d{2}$/.test(id)) D.money.weeks[id] = normWeek(w); });
        D.ui.notice = 'Bütçe verilerin taşındı';
      }
    } catch (e) {}
    try {
      const oa = JSON.parse(localStorage.getItem(OLD_ADIM_KEY) || 'null');
      if (oa && Array.isArray(oa.habits) && oa.log) { mergeLegacyAdim(oa); D.ui.notice = D.ui.notice ? 'Bütçe ve Momentum verilerin taşındı' : 'Momentum verilerin taşındı'; }
    } catch (e) {}
    if (D.ui.notice) saveNow();
  }
  S = D.money.settings;
}
function serial() {
  const o = clone(D);
  const weeks = {}; Object.entries(D.money.weeks).forEach(([id, w]) => { if (hasData(w)) weeks[id] = w; });
  o.money.weeks = weeks;
  return JSON.stringify(o);
}
function saveNow(noStamp) {
  clearTimeout(saveTimer); saveTimer = null;
  try { localStorage.setItem(KEY, serial()); storageOk = true; if (!noStamp && typeof stampChanges === 'function') stampChanges(); }
  catch (e) { if (storageOk) toast(T('Kaydedilemedi: telefon hafızası dolu ya da kapalı.')); storageOk = false; }
}
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }
window.addEventListener('pagehide', () => { if (saveTimer) saveNow(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) saveNow(); });

// ---------- budget helpers ----------
const hasData = (w) => w && ((+w.uberEarn || 0) > 0 || (+w.uberHours || 0) > 0 || (+w.cashHours || 0) > 0 || (w.extras || []).length > 0 || (w.daily || []).length > 0 || (w.note || '') !== '');
// daily entries count as extra expenses; the budget engine (weekCalc) itself stays untouched
const dailySum = (w) => r2(((w && w.daily) || []).reduce((a, x) => a + (+x.amount || 0), 0));
function calc(w) {
  w = w || { extras: [] }; const d = dailySum(w);
  const c = weekCalc(d ? Object.assign({}, w, { extras: (w.extras || []).concat([{ name: 'daily', amount: d }]) }) : w);
  c.daily = d; c.extraOnly = r2(c.extra - d); return c;
}
function weekObj(id) { const W = D.money.weeks; if (!W[id]) W[id] = { start: id, uberEarn: '', uberHours: '', fuel: '', cashHours: '', extras: [], note: '' }; if (!Array.isArray(W[id].extras)) W[id].extras = []; if (!Array.isArray(W[id].daily)) W[id].daily = []; return W[id]; }
const getWeek = (id) => D.money.weeks[id];
function monthWeeks(y, m) { return mondaysIn(y, m).filter((id) => hasData(getWeek(id))); }
function monthSummary(y, m) { const ids = monthWeeks(y, m); const cs = ids.map((id) => calc(getWeek(id))); return { n: ids.length, left: cs.reduce((a, c) => a + c.left, 0), income: cs.reduce((a, c) => a + c.income, 0) }; }

// ---------- growth helpers ----------
const G = () => D.growth;
const doneOn = (k) => G().log[k] || [];
const isDone = (h, k) => doneOn(k).includes(h);
function toggleHabit(h, k) { const a = doneOn(k).slice(), i = a.indexOf(h); if (i >= 0) a.splice(i, 1); else a.push(h); if (a.length) G().log[k] = a; else delete G().log[k]; save(); }

// ---------- lazy script loader ----------
const scriptCache = {};
function loadScript(url, globalName) {
  if (window[globalName]) return Promise.resolve(window[globalName]);
  if (scriptCache[url]) return scriptCache[url];
  scriptCache[url] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = url; s.async = true; s.crossOrigin = 'anonymous';
    s.onload = () => (window[globalName] ? res(window[globalName]) : rej(new Error('missing')));
    s.onerror = () => { delete scriptCache[url]; s.remove(); rej(new Error('load')); };
    document.head.appendChild(s);
  });

}

function lineChart(pts, o = {}) {
  const W = o.w || 300, H = o.h || 90, P = { l: 30, r: 8, t: 10, b: 18 };
  const vals = pts.filter((p) => p.v != null);
  if (vals.length < 1) return `<div class="note">${T('Veri yok')}</div>`;
  let mn = Math.min(...vals.map((p) => p.v)), mx = Math.max(...vals.map((p) => p.v));
  if (o.min != null) mn = Math.min(mn, o.min); if (o.max != null) mx = Math.max(mx, o.max);
  if (mx - mn < 1) { mx += 1; mn -= 1; }
  const pad2 = (mx - mn) * 0.12; mn -= pad2; mx += pad2;
  const x = (i) => P.l + (pts.length < 2 ? (W - P.l - P.r) / 2 : i * (W - P.l - P.r) / (pts.length - 1));
  const y = (v) => P.t + (1 - (v - mn) / (mx - mn)) * (H - P.t - P.b);
  const col = o.color || 'var(--acc-line)';
  let dpath = '', started = false, firstX = 0, lastX = 0;
  pts.forEach((p, i) => { if (p.v == null) return; const cmd = started ? 'L' : 'M'; if (!started) firstX = x(i); dpath += cmd + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1) + ' '; lastX = x(i); started = true; });
  const area = dpath + `L${lastX.toFixed(1)} ${H - P.b} L${firstX.toFixed(1)} ${H - P.b} Z`;
  const li = pts.map((p, i) => [p, i]).filter((a) => a[0].v != null).pop();
  const fmt = o.fmt || ((v) => Math.round(v));
  const top = mx - pad2, bot = mn + pad2;
  const band = o.band ? `<rect x="${P.l}" y="${y(Math.min(o.band[1], mx)).toFixed(1)}" width="${W - P.l - P.r}" height="${Math.max(0, y(Math.max(o.band[0], mn)) - y(Math.min(o.band[1], mx))).toFixed(1)}" fill="${col}" opacity=".08"/>` : '';
  const goal = o.goal != null ? `<line x1="${P.l}" x2="${W - P.r}" y1="${y(o.goal).toFixed(1)}" y2="${y(o.goal).toFixed(1)}" stroke="var(--gold-line)" stroke-dasharray="3 3"/>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || T('grafik'))}">${band}${goal}
    <line x1="${P.l}" x2="${W - P.r}" y1="${y(top)}" y2="${y(top)}" stroke="var(--line)" stroke-dasharray="2 3"/>
    <line x1="${P.l}" x2="${W - P.r}" y1="${y(bot)}" y2="${y(bot)}" stroke="var(--line)" stroke-dasharray="2 3"/>
    <text x="${P.l - 4}" y="${y(top) + 3}" text-anchor="end">${fmt(top)}</text><text x="${P.l - 4}" y="${y(bot) + 3}" text-anchor="end">${fmt(bot)}</text>
    ${vals.length > 1 ? `<path d="${area}" fill="${col}" opacity=".12"/><path d="${dpath}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
    <circle cx="${x(li[1])}" cy="${y(li[0].v)}" r="3.5" fill="${col}" stroke="var(--surface)" stroke-width="1.5"/>
    <text x="${P.l}" y="${H - 4}">${esc(pts[0].lbl || '')}</text><text x="${W - P.r}" y="${H - 4}" text-anchor="end">${esc(pts[pts.length - 1].lbl || '')}</text></svg>`;
}
function barChart(pts, o = {}) {
  const W = o.w || 300, H = o.h || 90, P = { l: 30, r: 4, t: 10, b: 18 };
  const mx = Math.max(o.goal || 0, ...pts.map((p) => p.v || 0), 1);
  const bw = (W - P.l - P.r) / pts.length;
  const y = (v) => P.t + (1 - v / mx) * (H - P.t - P.b);
  const col = o.color || 'var(--acc-line)';
  const fmt = o.fmt || ((v) => Math.round(v));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || T('grafik'))}">
    <text x="${P.l - 4}" y="${y(mx) + 3}" text-anchor="end">${fmt(mx)}</text><text x="${P.l - 4}" y="${H - P.b + 3}" text-anchor="end">0</text>
    <line x1="${P.l}" x2="${W - P.r}" y1="${H - P.b}" y2="${H - P.b}" stroke="var(--line)"/>
    ${o.goal ? `<line x1="${P.l}" x2="${W - P.r}" y1="${y(o.goal)}" y2="${y(o.goal)}" stroke="var(--gold-line)" stroke-dasharray="3 3"/>` : ''}
    ${pts.map((p, i) => (p.v ? `<rect x="${(P.l + i * bw + bw * 0.18).toFixed(1)}" y="${y(p.v).toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${(H - P.b - y(p.v)).toFixed(1)}" rx="2" fill="${col}"/>` : '')).join('')}
    <text x="${P.l}" y="${H - 4}">${esc(pts[0].lbl || '')}</text><text x="${W - P.r}" y="${H - 4}" text-anchor="end">${esc(pts[pts.length - 1].lbl || '')}</text></svg>`;
}

// per-day totals of daily spending in the selected month
function monthDaily(y, m) {
  const pre = `${y}-${pad(m + 1)}-`, byDay = {};
  Object.values(D.money.weeks).forEach((w) => (w.daily || []).forEach((x) => { if (String(x.date).startsWith(pre)) (byDay[x.date] = byDay[x.date] || []).push(x); }));
  const ks = Object.keys(byDay).sort(); if (!ks.length) return '';
  const tot = r2(ks.reduce((a, k) => a + byDay[k].reduce((s, x) => s + (+x.amount || 0), 0), 0));
  return `<div class="card" id="mDaily">${head('cal', T('Günlük harcamalar'), `<span class="sub">${money(tot)}</span>`)}<div class="log">${ks.map((k) => { const d = fromId(k), es = byDay[k], s = r2(es.reduce((a, x) => a + (+x.amount || 0), 0));
    return `<div><span>${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} · ${T('{n} kayıt', { n: es.length })}</span><b>${money(s)}</b></div>`; }).join('')}</div></div>`;
}
function potState(p) { if (p.done) return [T('Satın alındı'), 'chip']; if (p.target > 0 && p.saved >= p.target) return [T('Hedefe ulaştı'), 'chip gold']; return [T('Yolda'), 'chip acc']; }
function paraPots() {
  const pots = D.money.pots, active = pots.filter((p) => !p.done), done = pots.filter((p) => p.done);
  const total = active.reduce((a, p) => a + p.saved, 0);
  let html = `<div class="card">${head('jar', T('Kumbaralar'), `<button type="button" class="btn sm" data-act="newPot">${ico('plus')}${T('Yeni')}</button>`)}
    ${pots.length ? `<div class="tiles">${tile(T('Kumbaralarda'), usd(total), T('{n} açık kumbara', { n: active.length }))}${tile(T('Hedeflere kalan'), usd(active.reduce((a, p) => a + Math.max(0, p.target - p.saved), 0)), T('Toplam'))}</div>`
      : empty('pots', T('Henüz kumbaran yok'), T('Bir şey için ayrı para biriktir: konsol, araba bakımı, Türkiye bileti ya da vergi gibi. Hedefe ulaşınca "Satın aldım" ile tutarı haftana gider olarak yaz.'), `<button type="button" class="btn sm" data-act="newPot">${ico('plus')}${T('İlk kumbarayı aç')}</button>`)}</div>`;
  html += active.map(potCard).join('');
  if (done.length) html += `<details class="card fold"><summary>${T('Tamamlananlar ({n})', { n: done.length })}</summary><div class="stack" style="margin-top:8px">${done.map(potCard).join('')}</div></details>`;
  return html;
}
function potCard(p) {
  const pc = p.done ? 100 : p.target ? Math.min(100, Math.round(p.saved / p.target * 100)) : 0, [st, cls] = potState(p);
  return `<article class="card pot" data-pot="${p.id}"><div class="pot-h"><span class="ico">${ico(p.icon || 'jar')}</span><div class="nm"><h3>${esc(p.name)}</h3><div class="amt"><b>${money(p.saved)}</b> / ${money(p.target)}</div></div><span class="${cls}">${st}</span></div>
    <div><div class="meter${p.target && p.saved >= p.target ? ' gold' : ''}"><i style="width:${pc}%"></i></div><div class="meter-l"><span>${pct(pc)}</span><span>${p.done ? T('Harcanan: {x}', { x: usd(p.spent || 0) }) + (p.doneOn ? ' · ' + dShort(p.doneOn) : '') : T('kalan {x}', { x: usd(Math.max(0, p.target - p.saved)) })}</span></div></div>
    ${p.done ? '' : `<div class="pot-ctl"><div class="money"><span>$</span><input id="pa-${p.id}" inputmode="decimal" placeholder="${T('Tutar')}" aria-label="${esc(T('{x} için tutar', { x: p.name }))}"></div><button type="button" class="btn sm" data-act="potAdd" data-id="${p.id}">${T('Ekle')}</button><button type="button" class="btn sm ghost" data-act="potTake" data-id="${p.id}">${T('Çek')}</button></div>
    <div class="btns"><button type="button" class="btn sm soft" data-act="potBuy" data-id="${p.id}">${ico('bag')}${T('Satın aldım')}</button><button type="button" class="btn sm soft" data-act="editPot" data-id="${p.id}">${ico('pen')}${T('Düzenle')}</button></div>`}
    ${p.log.length ? `<details class="fold"><summary>${T('Hareketler ({n})', { n: p.log.length })}</summary><div class="log">${p.log.slice().reverse().slice(0, 20).map((l) => `<div><span>${dShort(l.d)}${l.note ? ' · ' + esc(T(l.note)) : ''}</span><b class="${l.a >= 0 ? 'up' : 'down'}">${l.a >= 0 ? '+' : '−'}${usd(Math.abs(l.a))}</b></div>`).join('')}</div></details>` : ''}</article>`;
}

function tableOf(text) {
  const rows = parseCSV(text); if (rows.length < 2) return [];
  let hi = 0;
  const looksHeader = (r) => r.some((c) => /(start_time|day_time|create_time)$/.test(c.trim()));
  if (!looksHeader(rows[0]) && rows[1] && looksHeader(rows[1])) hi = 1;
  const hdr = rows[hi].map((h) => h.trim().split('.').pop());
  const out = [];
  for (let i = hi + 1; i < rows.length; i++) { const r = rows[i]; if (r.length < 2) continue; const o = {}; hdr.forEach((h, j) => { if (h && o[h] == null) o[h] = r[j]; }); out.push(o); }
  return out;
}
function offMin(s) { const m = /([+-])(\d{2}):?(\d{2})/.exec(s || ''); return m ? (m[1] === '-' ? -1 : 1) * (+m[2] * 60 + +m[3]) : null; }
function tsOf(v) { if (!v) return null; v = String(v).trim(); if (/^\d{11,}$/.test(v)) return new Date(+v); const d = new Date(v.replace(' ', 'T') + (/[zZ+]|[+-]\d\d:?\d\d$/.test(v) ? '' : 'Z')); return isNaN(d) ? null : d; }
function keyAt(v, off) { const d = tsOf(v); if (!d) return null; if (off != null) return new Date(d.getTime() + off * 60000).toISOString().slice(0, 10); return keyOf(d); }
function dayKey(r, which) {
  if (which !== 'end' && r.day_time && /^\d{11,}$/.test(r.day_time)) return new Date(+r.day_time).toISOString().slice(0, 10);
  return keyAt(which === 'end' ? (r.end_time || r.start_time) : (r.start_time || r.create_time), offMin(r.time_offset));
}
function kindOf(name) {
  const n = name.toLowerCase().split('/').pop();
  if (!n.endsWith('.csv')) return null;
  if (/tracker\.heart_rate\.|health\.heart_rate\./.test(n)) return 'hr';
  if (/shealth\.stress\.\d|health\.stress\.\d/.test(n)) return 'stress';
  if (/health\.weight\./.test(n)) return 'weight';
  if (/step_daily_trend/.test(n)) return 'stepsDaily';
  if (/pedometer_day_summary/.test(n)) return 'stepsDaily';
  if (/pedometer_step_count/.test(n)) return 'stepsRaw';
  if (/shealth\.sleep\.\d|health\.sleep\.\d/.test(n)) return 'sleep';
  return null;
}
async function importSamsung(files) {
  U.shMsg = T('Dosyalar okunuyor…'); U.shErr = false; renderAll();
  const texts = [];
  try {
    for (const f of files) {
      if (/\.zip$/i.test(f.name) || (f.type || '').includes('zip')) {
        let JSZip; try { JSZip = await loadScript(JSZIP_URL, 'JSZip'); } catch (e) { U.shMsg = T('Zip açıcı yüklenemedi (internet gerekli). Klasördeki CSV dosyalarını doğrudan seçmeyi dene.'); U.shErr = true; renderAll(); return; }
        const z = await JSZip.loadAsync(f);
        const names = Object.keys(z.files).filter((n) => kindOf(n));
        for (const n of names) texts.push([kindOf(n), await z.files[n].async('string')]);
      } else if (kindOf(f.name)) texts.push([kindOf(f.name), await f.text()]);
    }
  } catch (e) { U.shMsg = T('Zip dosyası açılamadı. Klasördeki CSV dosyalarını doğrudan seçmeyi dene.'); U.shErr = true; renderAll(); return; }
  if (!texts.length) { U.shMsg = T('Tanınan bir Samsung Health dosyası bulunamadı. Dosya adları “com.samsung.” ile başlamalı ve .csv ile bitmeli.'); U.shErr = true; renderAll(); return; }
  const agg = {}; const A = (k) => agg[k] || (agg[k] = { hr: [], hrMin: [], stress: [], stepsD: 0, stepsR: 0, sleep: 0, weight: null, wT: 0 });
  let height = null;
  for (const [kind, txt] of texts) {
    const rows = tableOf(txt);
    for (const r of rows) {
      if (kind === 'sleep') { const k = dayKey(r, 'end'); if (!k) continue; const s = tsOf(r.start_time), e = tsOf(r.end_time); let m = num(r.sleep_duration); if (m == null && s && e) m = (e - s) / 60000; if (m && m > 0 && m < 1080) A(k).sleep += m; continue; }
      const k = dayKey(r); if (!k) continue;
      if (kind === 'hr') { const v = num(r.heart_rate); if (v && v > 25 && v < 230) { A(k).hr.push(v); const mn = num(r.heart_rate_min); A(k).hrMin.push(mn && mn > 25 ? mn : v); } }
      else if (kind === 'stress') { const v = num(r.score); if (v != null && v >= 0 && v <= 100) A(k).stress.push(v); }
      else if (kind === 'stepsDaily') { const v = num(r.count != null ? r.count : r.step_count); if (v != null && v > A(k).stepsD) A(k).stepsD = v; }
      else if (kind === 'stepsRaw') { const v = num(r.count); if (v) A(k).stepsR += v; }
      else if (kind === 'weight') { const v = num(r.weight); const t = (tsOf(r.start_time) || new Date(0)).getTime(); if (v && v > 25 && v < 300 && t >= A(k).wT) { A(k).weight = v; A(k).wT = t; } const h = num(r.height); if (h && h > 100 && h < 230) height = h; }
    }
  }
  const cutoff = keyOf(addDays(new Date(), -400));
  const n = { hr: 0, stress: 0, steps: 0, sleep: 0, weight: 0 };
  for (const k in agg) {
    if (k < cutoff) continue; const a = agg[k], p = {};
    if (a.hr.length) { p.hr = Math.round(a.hr.reduce((s, v) => s + v, 0) / a.hr.length); p.hrMin = Math.round(Math.min(...a.hrMin)); n.hr++; }
    if (a.stress.length) { p.stress = Math.round(a.stress.reduce((s, v) => s + v, 0) / a.stress.length); n.stress++; }
    const st = Math.max(a.stepsD, a.stepsR); if (st) { p.steps = Math.round(st); n.steps++; }
    if (a.sleep) { p.sleep = Math.round(a.sleep); n.sleep++; }
    if (a.weight && hd(k).weight == null) { p.weight = Math.round(a.weight * 10) / 10; n.weight++; }
    if (Object.keys(p).length) setH(k, p);
  }
  if (height && !D.health.height) D.health.height = Math.round(height);
  const cut = keyOf(addDays(new Date(), -400)); Object.keys(D.health.days).forEach((k) => { if (k < cut) delete D.health.days[k]; });
  D.health.lastImport = Date.now();
  const parts = [n.hr && T('{n} gün nabız', { n: n.hr }), n.stress && T('{n} gün stres', { n: n.stress }), n.steps && T('{n} gün adım', { n: n.steps }), n.sleep && T('{n} gece uyku', { n: n.sleep }), n.weight && T('{n} kilo ölçümü', { n: n.weight })].filter(Boolean);
  U.shMsg = parts.length ? T('Aktarıldı: {x}.', { x: parts.join(', ') }) : T('Dosyalar okundu ama son 400 güne ait ölçüm bulunamadı.');
  U.shErr = !parts.length; save(); renderAll();
}

function fxRate() { const f = IV().fx; return f && f.rate ? { r: f.rate, est: false } : { r: FX_FALLBACK, est: true }; }
function holdingView(h) {
  const fx = fxRate().r, cur = h.currency || (h.market === 'ASX' ? 'AUD' : 'USD'), toAud = cur === 'USD' ? fx : 1;
  let price = null, src = 'none', day = null, dayPct = null, at = null;
  if (h.market === 'US') {
    const q = IV().prices[pKey(h.symbol)];
    if (q && q.c) { price = q.c; day = q.d; dayPct = q.dp; at = q.at; src = Date.now() - (q.at || 0) > 20 * 3600e3 ? 'stale' : 'live'; }
    else if (h.manualPrice) { price = h.manualPrice; src = 'manual'; at = h.manualAt; }
  } else if (h.manualPrice) { price = h.manualPrice; src = 'manual'; at = h.manualAt; }
  const pr = price != null ? price : h.avgCost || 0;
  const value = (h.units || 0) * pr * toAud, cost = (h.units || 0) * (h.avgCost || 0) * toAud;
  return { h, cur, price, src: price == null ? 'cost' : src, at, value, cost, gain: value - cost, gainPct: cost ? (value - cost) / cost * 100 : null, dayAud: day != null ? day * (h.units || 0) * toAud : null, dayPct };
}
function portfolio() {
  const rows = IV().holdings.map(holdingView).sort((a, b) => b.value - a.value);

  const dayRows = rows.filter((r) => r.dayAud != null), dayAud = dayRows.length ? dayRows.reduce((a, r) => a + r.dayAud, 0) : null;
  const prevBase = dayRows.reduce((a, r) => a + (r.value - r.dayAud), 0);

}

}

    const score = rows[i].filter((c) => { const t = String(c || '').trim(); return t && t.length < 40 && FIELDS.some((f) => f[2].test(t)); }).length;

}

}

  if (/asx|\bau\b|australia/i.test(mk)) return 'ASX'; if (/nyse|nasdaq|\bus\b|amex|arca|bats|america/i.test(mk)) return 'US';

function aggregate(sheets) {

      let sym = String(r[sh.map.symbol] || '').trim().toUpperCase(); if (!sym || sym.length > 12 || /total|toplam/i.test(sym)) { skipped.rows++; return; }

      if (sh.map.side != null) { const sv = String(r[sh.map.side] || '').trim(); if (/sell|sold|^s$|^sat(ış|is)?$/i.test(sv)) side = 'sell'; else if (/buy|bought|^b$|^al(ış|is)?$/i.test(sv)) side = 'buy'; else { skipped.rows++; return; } }
